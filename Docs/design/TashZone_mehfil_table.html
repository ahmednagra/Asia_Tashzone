const Sfx=(()=>{
  let ctx,noise,room,ready=false;
  const mkNoise=c=>{const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b};
  const mkRoom=c=>{const len=c.sampleRate*.34,b=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)*.34}
    const cv=c.createConvolver();cv.buffer=b;const g=c.createGain();g.gain.value=.3;
    cv.connect(g);g.connect(c.destination);return cv};
  function boot(){if(ctx)return;try{
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    noise=mkNoise(ctx);room=mkRoom(ctx);ready=true}catch(e){ready=false}}
  function live(){boot();if(ctx&&ctx.state==='suspended')ctx.resume()}
  const ok=()=>S.sound&&ready&&ctx&&ctx.state==='running';
  function wet(node,amt){if(room&&amt){const g=ctx.createGain();g.gain.value=amt;
    node.connect(g);g.connect(room)}}
  function src(){const s=ctx.createBufferSource();s.buffer=noise;s.loop=true;return s}
  function burst({hz,q,dur,amp,type='bandpass',rev=.3,delay=0}){
    if(!ok())return;const t=ctx.currentTime+delay;
    const s=src(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    f.type=type;f.frequency.value=hz;f.Q.value=q;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp,t+.004);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(ctx.destination);wet(g,rev);
    s.start(t);s.stop(t+dur+.05)}
  function tone({hz,dur=.2,amp=.07,type='sine',delay=0,rev=.35}){
    if(!ok())return;const t=ctx.currentTime+delay;
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=hz;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(ctx.destination);wet(g,rev);o.start(t);o.stop(t+dur+.05)}
  return{
    unlock:live,setOn(v){S.sound=v;if(v)live();else if(ctx&&ctx.state==='running')ctx.suspend()},
    flip(){burst({hz:2600,q:1.1,dur:.085,amp:.16,rev:.22})},
    place(){burst({hz:1500,q:.8,dur:.12,amp:.2,rev:.34});
            burst({hz:320,q:.6,dur:.09,amp:.1,type:'lowpass',rev:.3,delay:.008})},
    deal(n=13){for(let i=0;i<n;i++)burst({hz:2300+Math.random()*700,q:1.2,dur:.06,
      amp:.09,rev:.2,delay:i*.048})},
    slam(){burst({hz:180,q:.5,dur:.3,amp:.32,type:'lowpass',rev:.5});
           burst({hz:1800,q:.9,dur:.14,amp:.18,rev:.4,delay:.01})},
    sweep(){burst({hz:900,q:.4,dur:.4,amp:.13,rev:.45})},
    tick(){tone({hz:1720,dur:.05,amp:.045,type:'square',rev:.1})},
    chime(){tone({hz:1046.5,dur:.55,amp:.1});tone({hz:1568,dur:.42,amp:.06,delay:.055})},
    relief(){tone({hz:523.25,dur:.5,amp:.08});tone({hz:698.46,dur:.55,amp:.07,delay:.13})}
  };
})();
/* ══════════════════════════════════════════════════════════════════════════
   5 · VOICE
   The microphone is real: getUserMedia plus an analyser node, so the ring
   around your pip is your own level, measured, not a decoration. What this
   build cannot do is carry it to anybody — there is no signalling server in a
   single file, so against bots you are talking to an empty room. The UI says
   so rather than pretending somebody is listening.
   ══════════════════════════════════════════════════════════════════════════ */
const Voice=(()=>{
  let stream=null,ctx=null,an=null,buf=null,raf=null,level=0;
  const paint=()=>{
    const pip=document.querySelector('.vpip.me'),bar=document.querySelector('.vlevel i');
    if(pip)pip.classList.toggle('talk',level>.055);
    if(bar)bar.style.transform='scaleX('+Math.min(1,level*6).toFixed(3)+')';
  };
  const tick=()=>{
    if(!an)return;
    an.getByteTimeDomainData(buf);
    let sum=0;
    for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v}
    const rms=Math.sqrt(sum/buf.length);
    level=level*.72+rms*.28;
    paint();
    raf=requestAnimationFrame(tick);
  };
  return{
    get live(){return !!stream},
    get level(){return level},
    async start(){
      if(stream)return true;
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
        throw new Error('This browser will not give a page the microphone.');
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,
        noiseSuppression:true,autoGainControl:true}});
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      const src=ctx.createMediaStreamSource(stream);
      an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.6;
      buf=new Uint8Array(an.fftSize);
      src.connect(an);                      /* never to the destination — no echo */
      raf=requestAnimationFrame(tick);
      return true;
    },
    stop(){
      if(raf)cancelAnimationFrame(raf);raf=null;
      if(stream)stream.getTracks().forEach(t=>t.stop());
      if(ctx&&ctx.close)try{ctx.close()}catch(e){}
      stream=null;ctx=null;an=null;buf=null;level=0;paint();
    }
  };
})();

const Haptics={
  fire(p){if(!S.haptics||!navigator.vibrate)return;try{navigator.vibrate(p)}catch(e){}},
  tap(){this.fire(8)},release(){this.fire(12)},
  thulla(){this.fire([22,40,22])},win(){this.fire([12,30,18])},err(){this.fire([30,50,30])}
};

/* ══════════════════════════════════════════════════════════════════════════
   5 · ENGINES
   One shape of state for every family, so the table, the card layer and the
   seat ring never need to know which game they are drawing.
   ══════════════════════════════════════════════════════════════════════════ */
function newGame(gid,opt={}){
  const g=G(gid),n=Math.max(g.seats[0],Math.min(g.seats[1],opt.seats||S.room.seats||4));
  const names=['You',...shuffle(BOT_NAMES).slice(0,n-1)];
  const st={gid,fam:g.fam,n,mySeat:0,round:opt.round||1,phase:'dealing',
    players:Array.from({length:n},(_,i)=>({id:i,name:names[i],hand:[],bot:i!==0,
      out:false,voids:{},tricks:0,bid:0,pts:0,say:null})),
    trick:[],leadSuit:null,turn:0,high:0,parts:[],burned:0,stock:[],finished:[],
    seen:{},log:[],notice:null,flash:0,banner:null,shake:0,mood:null,
    over:false,bhabhi:null,winner:null,clock:null,left:0,sel:[],lesson:!!opt.lesson,
    rules:{...S.rules},trump:gid==='callbreak'?'S':null,broken:false,
    /* who broke the suit, and who carried the pile — kept for the record */
    thullas:{},took:{},
    open:false,conceded:false,order:null};
  const rules=st.rules;

  if(g.fam==='trick'){
    const ranks=gid==='235'?['5','6','7','8','9','10','J','Q','K','A']:RANKS;
    const d=shuffle(buildDeck(ranks));const per=Math.floor(d.length/n);
    st.players.forEach((p,i)=>p.hand=d.slice(i*per,i*per+per).sort(bySuit));
    st.players.forEach(p=>p.bid=gid==='callbreak'?Math.max(1,Math.round(
      p.hand.filter(c=>c.s==='S'||c.v>=11).length*.8)):0);
    st.turn=1%n;st.log=[line(`${st.players[st.turn].name} lead${vs(st.players[st.turn].name)} the first trick.`)];
    st.handSize=per;
  }
  if(g.fam==='inflation'){
    const d=shuffle(buildDeck());
    st.players.forEach((p,i)=>p.hand=[]);
    d.forEach((c,i)=>st.players[i%n].hand.push(c));
    st.players.forEach(p=>p.hand.sort(bySuit));
    const ace=st.players.findIndex(p=>p.hand.some(c=>c.id==='AS'));
    st.turn=rules.aceOpens?ace:Math.floor(Math.random()*n);
    st.forced=rules.aceOpens?'AS':null;
    st.log=[line(rules.aceOpens
      ?`${st.players[st.turn].name} hold${vs(st.players[st.turn].name)} the ace of spades.`
      :`${st.players[st.turn].name} open${vs(st.players[st.turn].name)} the table.`)];
  }
  if(g.fam==='capture'){
    const d=shuffle(buildDeck());
    st.players.forEach((p,i)=>p.hand=d.slice(4+i*8,4+i*8+8).sort(bySuit));
    st.floor={loose:d.slice(0,3),houses:[{v:10,cards:[mkCard('7','H'),mkCard('3','C')],
      owner:st.players[2].name,cemented:false}]};
    st.turn=0;st.score=[0,0];st.log=[line('The floor is set. Capture, build, or throw.')];
  }
  if(g.fam==='compare'){
    const d=shuffle(buildDeck());
    st.players.forEach((p,i)=>p.hand=d.slice(i*13,i*13+13).sort(bySuit));
    st.groups=[[],[],[],[]];st.up=false;st.turn=0;
    st.log=[line('Arrange 13 cards into 3 · 3 · 3 · 4, strongest group first.')];
  }
  if(g.fam==='layout'){
    const d=shuffle(buildDeck());
    st.players.forEach((p,i)=>p.hand=[]);
    d.forEach((c,i)=>st.players[i%n].hand.push(c));
    st.players.forEach(p=>p.hand.sort(bySuit));
    st.rows={S:[],H:[],D:[],C:[]};
    const who=st.players.findIndex(p=>p.hand.some(c=>c.id==='7H'));
    st.turn=who;st.log=[line(`${st.players[who].name} hold${vs(st.players[who].name)} the seven of hearts.`)];
  }
  if(g.fam==='claim'){
    const d=shuffle(buildDeck());
    st.players.forEach((p,i)=>p.hand=[]);
    d.forEach((c,i)=>st.players[i%n].hand.push(c));
    st.players.forEach(p=>p.hand.sort(bySuit));
    st.pile=[];st.rank='K';st.claim=null;st.window=null;st.turn=0;
    st.log=[line('Claim your cards face down. Anybody may challenge.')];
  }
  if(g.fam==='draw_discard'){
    const d=shuffle(buildDeck().concat(buildDeck()));
    st.players.forEach((p,i)=>p.hand=d.slice(i*21,i*21+21).sort(bySuit));
    st.stock=d.slice(n*21);st.discard=[st.stock.pop()];
    st.tiplu=st.stock[0];st.sawTiplu=!!rules.openTiplu;st.step='draw';st.turn=0;
    st.log=[line('Draw from the stock or take the discard, then throw one away.')];
  }
  st.players.forEach(p=>p.start=p.hand.length);
  return st;
}
const vs=n=>n==='You'?'':'s';
const line=(t,k='i')=>({t,k,id:Math.random()});
/* the same thing happening twice in a row is one line with a count, not two
   identical lines stacked up the side of the table */
const pushLog=(st,t,k='i')=>{
  const top=st.log[0];
  if(top&&top.t===t){top.n=(top.n||1)+1;top.id=Math.random();return}
  st.log=[line(t,k)].concat(st.log).slice(0,4);
};
const alive=st=>st.players.filter(p=>p.hand.length>0);
function nextSeat(st,from){for(let k=1;k<=st.n;k++){const i=(from+k)%st.n;
  if(st.players[i].hand.length)return i}return from}
const followSuit=(hand,lead)=>{if(!lead)return hand;
  const f=hand.filter(c=>c.s===lead);return f.length?f:hand};

/* legal move for the seat whose turn it is, in any family */
function legalFor(st,seat){
  const p=st.players[seat];if(!p)return [];
  switch(st.fam){
    case 'trick':{
      if(!st.trick.length){
        if(st.gid==='callbreak'&&!st.broken&&p.hand.some(c=>c.s!=='S'))
          return p.hand.filter(c=>c.s!=='S');
        return p.hand;
      }
      const ok=followSuit(p.hand,st.leadSuit);
      if(st.rules.mustBeat&&st.trick.length){
        const best=st.trick[st.high].card;
        const beats=ok.filter(c=>(st.trump&&c.s===st.trump&&best.s!==st.trump)||
          (c.s===best.s&&c.v>best.v));
        if(beats.length)return beats;
      }
      return ok;
    }
    case 'inflation':
      if(st.forced)return p.hand.filter(c=>c.id===st.forced);
      return followSuit(p.hand,st.trick.length?st.leadSuit:null);
    case 'layout':return p.hand.filter(c=>playableSeven(st,c));
    case 'claim':return p.hand;
    case 'capture':{
      if(!st.rules.mustCapture)return p.hand;
      const can=p.hand.filter(c=>captureOptions(st,c.id).length);
      return can.length?can:p.hand;
    }
    case 'compare':return p.hand;
    case 'draw_discard':return st.step==='discard'?p.hand:[];
  }
  return [];
}
function playableSeven(st,c){const r=st.rows[c.s];const v=c.v+2;
  if(!r.length)return v===7;return v===Math.min(...r)-1||v===Math.max(...r)+1}

/* ── the move ──────────────────────────────────────────────────────────── */
function playCard(st,seat,id){
  const p=st.players[seat];
  if(st.fam==='claim'){
    const ids=seat===st.mySeat?S.sel.slice():p.hand.slice(0,2).map(c=>c.id);
    if(!ids.length)return false;
    const truth=ids.every(x=>{const cc=p.hand.find(c=>c.id===x);return cc&&cc.r===st.rank});
    ids.forEach(x=>{const cc=p.hand.find(y=>y.id===x);if(cc)st.pile.push(cc)});
    p.hand=p.hand.filter(x=>!ids.includes(x.id));
    st.claim={who:p.name,n:ids.length,truth};
    if(seat===st.mySeat)S.sel=[];
    Sfx.place();pushLog(st,p.name+' claim'+vs(p.name)+' '+ids.length+' \u00d7 '+st.rank+'.');
    checkOut(st,p);
    st.turn=nextSeat(st,seat);
    if(st.turn===st.mySeat&&st.claim.who!==p.name){}
    if(seat!==st.mySeat)st.window={who:p.name,n:ids.length,truth,left:6};
    if(st.rules.climbRank){
      st.rank=RANKS[(RANKS.indexOf(st.rank)+1)%RANKS.length];
      pushLog(st,'The rank climbs to '+st.rank+'.');
    }
    return true;
  }
  const c=p.hand.find(x=>x.id===id);if(!c)return false;
  if(st.fam==='layout'){
    p.hand=p.hand.filter(x=>x.id!==id);st.rows[c.s].push(c.v+2);st.seen[id]=true;
    pushLog(st,`${p.name} play${vs(p.name)} the ${c.r}${c.g}.`);
    Sfx.place();checkOut(st,p);st.turn=nextSeat(st,seat);return true;
  }
  if(st.fam==='draw_discard'){
    p.hand=p.hand.filter(x=>x.id!==id);st.discard.push(c);st.step='draw';
    st.turn=nextSeat(st,seat);Sfx.place();return true;
  }
  /* trick and inflation share one trick machine */
  p.hand=p.hand.filter(x=>x.id!==id);
  const lead=st.trick.length===0;
  if(lead){st.leadSuit=c.s;st.high=0;st.parts=alive(st).map(q=>q.id).concat(p.hand.length?[]:[seat]);
    if(!st.parts.includes(seat))st.parts.push(seat)}
  st.trick.push({card:c,seat,dx:rand(-26,26),dy:rand(-20,20),rot:rand(-15,15)});
  st.seen[c.id]=true;st.forced=null;Sfx.place();Haptics.release();
  if(c.s==='S')st.broken=true;

  if(!lead){
    if(c.s===st.leadSuit){
      if(c.v>st.trick[st.high].card.v)st.high=st.trick.length-1;
    }else{
      p.voids[st.leadSuit]=true;
      if(st.fam==='inflation'&&!st.rules.fullTrick){
        const victim=st.trick[st.high].seat;
        pushLog(st,`${p.name} break${vs(p.name)} the suit. ${st.players[victim].name} pick${vs(st.players[victim].name)} up ${st.trick.length}.`,'t');
        st.phase='thulla';st.collector=victim;st.flash++;st.shake++;st.mood='red';
        st.thullas[seat]=(st.thullas[seat]||0)+1;
        st.banner='Thulla!';Sfx.slam();Haptics.thulla();say(st,p.id,'thulla');return true;
      }
      if(st.fam==='inflation')st.broke=st.broke||seat;
    }
  }
  if(st.trick.length>=st.parts.length){
    if(st.fam==='inflation'&&st.broke!=null&&st.rules.fullTrick){
      const victim=st.trick[st.high].seat;
      pushLog(st,`The suit was broken. ${st.players[victim].name} pick${vs(st.players[victim].name)} up ${st.trick.length}.`,'t');
      st.phase='thulla';st.collector=victim;st.flash++;st.shake++;st.mood='red';
      st.thullas[st.broke]=(st.thullas[st.broke]||0)+1;
      st.banner='Thulla!';Sfx.slam();Haptics.thulla();st.broke=null;return true;
    }
    const w=trickWinner(st);
    pushLog(st,`${st.players[w].name} take${vs(st.players[w].name)} it with the ${st.trick[st.high].card.r}${st.trick[st.high].card.g}.`,'w');
    st.phase='won';st.winner=w;st.mood='gold';say(st,w,'win');Haptics.win();return true;
  }
  st.turn=nextSeat(st,seat);
  if(st.fam==='trick'&&!st.players[st.turn].hand.length)st.turn=nextSeat(st,st.turn);
  return true;
}
function trickWinner(st){
  if(st.fam!=='trick')return st.trick[st.high].seat;
  let best=st.trick[0];
  for(const e of st.trick){const a=e.card,b=best.card;
    const at=st.trump&&a.s===st.trump,bt=st.trump&&b.s===st.trump;
    if(at&&!bt)best=e;
    else if(at===bt&&a.s===b.s&&a.v>b.v)best=e;
    else if(!at&&!bt&&a.s===st.leadSuit&&b.s!==st.leadSuit)best=e}
  return best.seat;
}
function checkOut(st,p){
  if(p.hand.length===0&&!st.finished.includes(p.id)){
    st.finished.push(p.id);
    pushLog(st,`${p.name} ${p.name==='You'?'are':'is'} out — safe.`,'s');
    if(p.id===st.mySeat)Sfx.relief();say(st,p.id,'safe')}
}
/* ── resolve the trick once the table has looked at it ────────────────── */
function resolve(st){
  const R=st.rules;let leader;
  /* keep the trick that is about to be swept: players ask what just happened */
  if(st.trick.length)st.lastTrick={
    cards:st.trick.map(e=>({seat:e.seat,name:st.players[e.seat].name,card:e.card})),
    thulla:st.phase==='thulla',
    who:st.phase==='thulla'?st.players[st.collector].name
       :st.winner!=null?st.players[st.winner].name:null,
    round:st.round};
  if(st.phase==='thulla'){
    const v=st.collector,p=st.players[v];
    st.took[v]=(st.took[v]||0)+1;
    p.hand=p.hand.concat(st.trick.map(e=>e.card)).sort(bySuit);
    st.trick.forEach(e=>{delete st.seen[e.card.id]});   /* back in a hand — un-remembered */
    leader=v;Sfx.sweep();
  }else if(st.phase==='won'){
    const w=st.winner;leader=w;let taken=st.trick.map(e=>e.card);
    if(st.fam==='trick'){st.players[w].tricks++;st.burned+=taken.length}
    else{
      const others=st.players.filter(q=>q.id!==w&&q.hand.length).length;
      /* the lead is a debt, not a prize: you may not put it down and walk out */
      if(R.powerTransfer&&!st.players[w].hand.length&&others>0){
        const back=taken.reduce((lo,c)=>c.v<lo.v?c:lo,taken[0]);
        taken=taken.filter(c=>c.id!==back.id);st.players[w].hand=[back];delete st.seen[back.id];
        pushLog(st,`${st.players[w].name} cannot leave holding the lead — the ${back.r}${back.g} comes back.`,'p');
        st.notice=`${st.players[w].name} must pass the lead before going out`;
      }
      if(R.recycle){
        st.stock=st.stock.concat(taken);
        /* every trick leaves at least one card behind, or a two-handed endgame
           would cycle the same cards for ever and never finish */
        const want=Math.min(2,taken.length-1,st.stock.length);
        if(st.stock.length>=10&&want>0&&st.players[w].hand.length){
          const draw=st.stock.splice(0,want);
          st.players[w].hand=st.players[w].hand.concat(draw).sort(bySuit);
          draw.forEach(c=>{delete st.seen[c.id]});
          st.notice=`The stock hands ${want===1?'a card':'two cards'} back to ${st.players[w].name}`;
        }
      }else st.burned+=taken.length;
      Sfx.sweep();
    }
  }else return;
  st.players.forEach(p=>checkOut(st,p));
  st.trick=[];st.leadSuit=null;st.high=0;st.parts=[];st.collector=null;st.winner=null;
  st.banner=null;st.mood=null;st.broke=null;

  if(st.fam==='trick'){
    if(!alive(st).length)return endHand(st);
    st.turn=leader;st.phase='playing';return;
  }
  const left=alive(st);
  if(left.length<=1){st.bhabhi=left[0]||null;return endHand(st)}
  if(!st.players[leader].hand.length)leader=nextSeat(st,leader);
  st.turn=leader;st.phase='playing';
}
function endHand(st){
  st.over=true;st.phase='over';
  if(st.fam==='trick'){
    st.ledger=st.players.map(p=>{const made=p.tricks>=p.bid;
      const pts=made?p.bid*10+(p.tricks-p.bid):-p.bid*10;
      return{name:p.name,bid:p.bid,took:p.tricks,pts,
        why:`Called ${p.bid} · took ${p.tricks} → ${made?'+':'−'}${Math.abs(pts/10).toFixed(1)}`}});
  }
  /* Hazari is settled group against group, so the bots need their thirteen
     cards arranged too — strongest first, same 3 · 3 · 3 · 4 shape as yours. */
  if(st.fam==='compare'){
    const SIZES=[3,3,3,4];
    const arrange=hand=>{
      const pool=[...hand].sort((a,b)=>rv(b.r)-rv(a.r));const out=[];
      for(const n of SIZES)out.push(pool.splice(0,n));
      return out;
    };
    const weight=gr=>gr.reduce((a,c)=>a+rv(c.r)+2,0);
    st.showdown=st.players.map(p=>{
      const gs=p.id===st.mySeat
        ?(groupsFull(st)?st.groups.map(gr=>gr.slice()):arrange(st.groups.flat().concat(p.hand)))
        :arrange(p.hand);
      return{name:p.name,me:p.id===st.mySeat,groups:gs,w:gs.map(weight),wins:0};
    });
    SIZES.forEach((_,i)=>{
      let best=-1,who=[];
      st.showdown.forEach((r,j)=>{const v=r.w[i]||0;
        if(v>best){best=v;who=[j]}else if(v===best)who.push(j)});
      who.forEach(j=>st.showdown[j].wins+=who.length>1?0:1);
    });
    st.showdown.sort((a,b)=>b.wins-a.wins||b.w[0]-a.w[0]);
  }
  Sfx.chime();
  return st;
}
const rand=(a,b)=>a+Math.random()*(b-a);
function say(st,seat,kind){const pool=BANTER[kind];if(!pool||seat===st.mySeat)return;
  const p=st.players[seat];p.say=pool[Math.floor(Math.random()*pool.length)];
  setTimeout(()=>{p.say=null;if(S.g===st)paintSeats()},2200)}

/* ══════════════════════════════════════════════════════════════════════════
   6 · THE READING BOT
   Shedding games are liability games: winning a trick is cheap, being the
   high card when somebody breaks the suit is what ruins you. The bot keeps
   three books — who is void in what, what has been seen, and how heavy its
   own hand is — and spends them on one plan: lead low into a suit somebody
   cannot follow, so the break lands on another player's high card.
   ══════════════════════════════════════════════════════════════════════════ */
function outstanding(st,suit,above){
  if(!st.rules.counting)return 1;
  /* a hand played face up really is known: those cards stop being unknowns */
  const mine=st.open?new Set(st.players[st.mySeat].hand.map(c=>c.id)):null;
  return RANKS.filter(r=>rv(r)>above)
    .filter(r=>!st.seen[r+suit]&&!(mine&&mine.has(r+suit))).length;
}
function trapCards(st,p){
  const set=new Set();const opps=st.players.filter(q=>q.id!==p.id&&q.hand.length);
  for(const c of p.hand){
    const voidThere=opps.some(q=>q.voids[c.s]);
    const lowEnough=outstanding(st,c.s,c.v)>=2;
    if(voidThere&&lowEnough)set.add(c.id);
  }
  return set;
}
function botPick(st,p){
  const legal=legalFor(st,p.id);
  if(legal.length<=1)return legal[0];
  const lvl=S.room.botLevel;                       /* 0 easy · 1 medium · 2 hard */
  if(lvl===0)return legal[Math.floor(Math.random()*legal.length)];
  const opps=st.players.filter(q=>q.id!==p.id&&q.hand.length);

  if(st.fam==='trick'){
    if(!st.trick.length){
      /* lead the longest suit's top card, holding trumps back */
      const cnt={};legal.forEach(c=>cnt[c.s]=(cnt[c.s]||0)+1);
      const pick=legal.slice().sort((a,b)=>
        (a.s===st.trump?1:0)-(b.s===st.trump?1:0)||cnt[b.s]-cnt[a.s]||b.v-a.v);
      return pick[0];
    }
    const best=st.trick[st.high].card;
    const beats=legal.filter(c=>(st.trump&&c.s===st.trump&&best.s!==st.trump)||
      (c.s===best.s&&c.v>best.v));
    const lastToPlay=st.trick.length===st.parts.length-1;
    if(beats.length&&(lastToPlay||p.tricks<p.bid))
      return beats.reduce((lo,c)=>c.v<lo.v?c:lo,beats[0]);
    return legal.reduce((lo,c)=>c.v<lo.v?c:lo,legal[0]);
  }

  if(st.fam==='inflation'){
    if(!st.trick.length){
      const scored=legal.map(c=>{
        let s=0;
        if(opps.some(q=>q.voids[c.s]))s+=60;            /* somebody must break it */
        s+=(12-c.v)*3;                                   /* lead low               */
        s-=outstanding(st,c.s,c.v)*2;                    /* not if it wins by force */
        if(lvl===2&&p.hand.filter(x=>x.s===c.s).length<=2)s+=12; /* shorten a suit */
        return{c,s}});
      scored.sort((a,b)=>b.s-a.s);return scored[0].c;
    }
    const voidInLead=!p.hand.some(c=>c.s===st.leadSuit);
    if(voidInLead)                                       /* breaking — dump the worst */
      return legal.reduce((hi,c)=>c.v>hi.v?c:hi,legal[0]);
    const best=st.trick[st.high].card;
    const under=legal.filter(c=>c.v<best.v);
    const lastToPlay=st.trick.length===st.parts.length-1;
    /* ducking is free unless you are last, where taking it costs nothing */
    if(under.length&&!lastToPlay)return under.reduce((hi,c)=>c.v>hi.v?c:hi,under[0]);
    if(lastToPlay)return legal.reduce((hi,c)=>c.v>hi.v?c:hi,legal[0]);
    return legal.reduce((lo,c)=>c.v<lo.v?c:lo,legal[0]);
  }
  if(st.fam==='layout')return legal[Math.floor(Math.random()*legal.length)];
  return legal[0];
}

/* ══════════════════════════════════════════════════════════════════════════
   7 · GEOMETRY — where every card in the deck belongs, right now
   The scene is an ellipse. Seat 0 is always the bottom of that ellipse, so
   the table rotates around the viewer rather than the viewer moving round
   the table. Everything else is measured from there.
   ══════════════════════════════════════════════════════════════════════════ */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function geom(){
  const el=document.getElementById('scene');
  return geomFor(el&&el.clientWidth?el.clientWidth:S.vw,
                 el&&el.clientHeight?el.clientHeight:S.vh);
}
/* the same maths for a box whose size we state outright — the atlas needs a
   table laid out for a 360-wide frame while the real scene is another size */
function geomFor(w,h){
  const land=w>h*1.35;
  /* a card is sized by whichever of the two axes runs out first, so it grows
     on a desk and shrinks on a phone without either one being guessed at */
  const base=land?Math.min(h*.2,w*.076):Math.min(w*.168,h*.118);
  const cw=clamp(S.big?base*1.2:base,44,98);
  const rx=w*(land?.40:.46),ry=h*(land?.38:.32);
  return{w,h,land,cw,ch:cw*1.4,cx:w/2,cy:h*(land?.42:.40),rx,ry,
    seatR:{x:rx*(land?1.02:1.0),y:ry*(land?1.0:1.02)}};
}
/* Seat 0 is the viewer, at the bottom of the ellipse; the rest run
   counter-clockwise from there — the table turns, not the player.
   Past five opponents the ellipse gets too crowded to read, so the others
   line up along the top edge instead, which is what a long table looks like. */
function seatPoint(g,r,n,f=1){
  if(r===0)return{x:g.cx,y:g.cy+g.seatR.y*f,a:Math.PI/2,row:false};
  if(n>=6){
    const k=n-1,t=(r-.5)/k;
    const span=g.w-96;
    return{x:48+span*t,y:g.h*(g.land?.17:.16)*f,a:-Math.PI/2,row:true};
  }
  const a=(90+360*r/n)*Math.PI/180;
  return{x:g.cx+g.seatR.x*f*Math.cos(a),y:g.cy+g.seatR.y*f*Math.sin(a),a,row:false};
}
const relSeat=(st,i)=>(i-st.mySeat+st.n)%st.n;

/* ── the fan ────────────────────────────────────────────────────────────
   transform-origin sits below the hand, so most of the spread comes from
   rotation about that hub. radius·(1−cos α) is the versine — the true
   circular sag, not the parabola most implementations settle for. Cards you
   may legally play carry more weight, so the room the dimmed cards give up
   is handed straight to the ones under your thumb. */
function fanLayout(n,{radius=175,maxSpread=70,maxStep=5.6,maxWidth=700,weights=null}={}){
  if(n<=0)return [];
  const step=Math.min(maxStep,maxSpread/Math.max(n,1));
  const spacing=Math.min(38,(maxWidth/Math.max(n,1))*.62);
  let w=weights&&weights.length===n?weights:null;
  if(w){const mean=w.reduce((a,b)=>a+b,0)/n;w=mean>0?w.map(v=>v/mean):null}
  const pos=[0];
  for(let i=1;i<n;i++)pos.push(pos[i-1]+spacing*(w?(w[i-1]+w[i])/2:1));
  const half=pos[n-1]/2,sweep=step*(n-1)/2,out=[];
  for(let i=0;i<n;i++){
    const x=pos[i]-half,deg=half>0?(x/half)*sweep:0,rad=deg*Math.PI/180;
    out.push({x,y:radius*(1-Math.cos(rad)),deg});
  }
  return out;
}
/* ── how the hand is arranged ──────────────────────────────────────────────
   Three ways, and the player's own beats the clever one: a manual order is
   kept as a list of ids on the hand, so it survives dealing and picking up. */
function arrangeHand(st,hand,focus){
  if(S.handSort==='manual'){
    const ord=st.order||(st.order=hand.map(c=>c.id));
    const pos=new Map(ord.map((id,i)=>[id,i]));
    let tail=ord.length;
    return hand.slice().sort((a,b)=>
      (pos.has(a.id)?pos.get(a.id):tail++)-(pos.has(b.id)?pos.get(b.id):tail++));
  }
  if(S.handSort==='rank')
    return hand.slice().sort((a,b)=>b.v-a.v||'SHCD'.indexOf(a.s)-'SHCD'.indexOf(b.s));
  return orderHand(hand,focus,1.18,.66);
}
/* move one card along the manual order, so a hand can be grouped by hand */
function moveCard(st,id,dir){
  const hand=arrangeHand(st,st.players[st.mySeat].hand,null);
  const ids=hand.map(c=>c.id),i=ids.indexOf(id),j=i+dir;
  if(i<0||j<0||j>=ids.length)return false;
  ids.splice(j,0,ids.splice(i,1)[0]);
  st.order=ids;return true;
}
/* Suit order is cyclic, so the fan can start on any suit and still read as an
   ordered hand. When a suit is led we take the rotation that leaves the
   playable block nearest the middle of the arc — under the thumb, not out at
   the hinge. */
function orderHand(hand,focus,wHot,wCold){
  if(!focus||hand.length<2)return hand.slice();
  const cyc=['S','H','C','D'];let best=null;
  for(let r=0;r<4;r++){
    const order=cyc.slice(r).concat(cyc.slice(0,r));
    const rank=Object.fromEntries(order.map((k,i)=>[k,i]));
    const led=rank[focus];let L=0,R=0;
    for(const c of hand){const wt=c.s===focus?wHot:wCold;
      if(rank[c.s]<led)L+=wt;else if(rank[c.s]>led)R+=wt}
    const gap=Math.abs(L-R);
    if(!best||gap<best.gap)best={gap,rank};
  }
  return hand.slice().sort((a,b)=>best.rank[a.s]-best.rank[b.s]||a.v-b.v);
}
/* shadow spreads AND thins as a card rises — the one cue that reads as height */
const shadowFor=z=>{const blur=8+z*.42,off=3+z*.3,a=Math.max(.18,.52-z*.0024);
  return `0 ${off.toFixed(1)}px ${blur.toFixed(1)}px rgba(3,14,11,${a.toFixed(3)})`};


/* ── Seep: every capture a card allows, listed rather than chosen for you ── */
const pipValue=c=>({J:11,Q:12,K:13,A:1}[c.r]||parseInt(c.r,10));
function captureOptions(st,id){
  const c=st.players[st.mySeat].hand.find(x=>x.id===id);if(!c)return [];
  const v=pipValue(c),out=[];
  st.floor.houses.forEach((h,i)=>{if(h.v===v)out.push({house:i,label:'the house of '+h.v})});
  const L=st.floor.loose.map(pipValue);
  L.forEach((x,i)=>{if(x===v)out.push({loose:[i],label:st.floor.loose[i].id})});
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++)
    if(L[i]+L[j]===v)out.push({loose:[i,j],label:st.floor.loose[i].id+' + '+st.floor.loose[j].id});
  return out;
}
function doCapture(st,opt){
  const me=st.players[st.mySeat];
  const c=me.hand.find(x=>x.id===S.sel[0]);if(!c)return;
  me.hand=me.hand.filter(x=>x.id!==c.id);
  let n=1;
  if(opt.house!=null){n+=st.floor.houses[opt.house].cards.length;st.floor.houses.splice(opt.house,1)}
  else{n+=opt.loose.length;st.floor.loose=st.floor.loose.filter((_,i)=>!opt.loose.includes(i))}
  st.score[0]+=n>2?n+2:n;
  S.sel=[];st.chooser=null;
  pushLog(st,'You capture '+n+' cards with the '+c.r+c.g+'.','w');
  Sfx.sweep();checkOut(st,me);
  st.turn=nextSeat(st,st.turn);
}
/* ── Hazari: put the selected cards into a group ──────────────────────── */
function placeGroup(st,gi){
  if(st.up||!S.sel.length)return;
  const max=gi===3?4:3,room=max-st.groups[gi].length;
  S.sel.slice(0,room).forEach(id=>{
    const me=st.players[st.mySeat];
    const c=me.hand.find(x=>x.id===id);if(!c)return;
    me.hand=me.hand.filter(x=>x.id!==id);
    st.groups[gi].push(c);
  });
  S.sel=[];Sfx.place();
}
const groupsFull=st=>st.groups.every((g,i)=>g.length===(i===3?4:3));

/* ══════════════════════════════════════════════════════════════════════════
   8 · THE CARD LAYER
   Every card owns one DOM node for the whole hand. Dealing, playing,
   sweeping and collecting are all the same operation — write a new transform
   and let the compositor carry the card there. Nothing is destroyed while it
   is moving, so no animation is ever cut off half way.
   ══════════════════════════════════════════════════════════════════════════ */
const nodes=new Map();      /* card id → element                            */
let lastFocus=null;

function ensureNode(c){
  let el=nodes.get(c.id);
  if(el)return el;
  el=document.createElement('div');
  el.innerHTML=cardHTML(c,false);
  el=el.firstElementChild;
  el.dataset.id=c.id;
  el.setAttribute('role','button');
  el.setAttribute('tabindex','-1');
  el.style.setProperty('--w','var(--cw)');
  el.classList.add('snap');
  nodes.set(c.id,el);
  document.getElementById('cards').appendChild(el);
  return el;
}
function setT(el,t){
  el.style.setProperty('--tx',t.x.toFixed(1)+'px');
  el.style.setProperty('--ty',t.y.toFixed(1)+'px');
  el.style.setProperty('--tz',(t.z||0).toFixed(1)+'px');
  el.style.setProperty('--rot',(t.rot||0).toFixed(2)+'deg');
  el.style.setProperty('--ry',(t.faceUp?0:180)+'deg');
  el.style.setProperty('--rx',(t.rx||0)+'deg');
  el.style.setProperty('--sc',(t.sc||1).toFixed(3));
  el.style.zIndex=t.zi||1;
  el.style.boxShadow=shadowFor(t.z||0);
}

/* ── where does every card belong right now? ──────────────────────────── */
function computeTargets(st,g){
  const T=new Map();
  const cw=g.cw,ch=g.ch;
  const park={x:g.cx-cw/2,y:-ch*1.6,z:0,rot:0,faceUp:false,sc:.7,zi:0,hidden:true};

  /* my hand — the fan */
  const me=st.players[st.mySeat];
  const voidInLead=st.trick.length&&st.leadSuit&&!me.hand.some(c=>c.s===st.leadSuit);
  const focus=st.trick.length&&st.leadSuit&&!voidInLead?st.leadSuit:null;
  const legalIds=new Set((st.turn===st.mySeat&&st.phase==='playing'?legalFor(st,st.mySeat):[]).map(c=>c.id));
  const hand=arrangeHand(st,me.hand,focus);
  const traps=(st.fam==='inflation'&&st.turn===st.mySeat&&!st.trick.length&&S.hints)
    ?trapCards(st,me):new Set();
  const handW=Math.min(g.w-cw*.6,g.land?g.w*.72:g.w-16);
  /* ── spread: every card wholly visible ──────────────────────────────────
     A fan is beautiful and hides eleven of thirteen faces. In spread the
     cards are tiled edge to edge with a hair of air between them, shrunk
     until the whole hand fits the width it is given and the rows it needs. */
  if(S.handLay==='spread'&&hand.length){
    const gapF=1.08;                                   /* card width plus air */
    const maxRows=Math.max(1,Math.min(3,Math.floor((g.h*.44)/(ch*.82))));
    let k=1,cols=hand.length,rows2=1;
    for(rows2=1;rows2<=maxRows;rows2++){
      cols=Math.ceil(hand.length/rows2);
      k=Math.min(1,handW/(cols*cw*gapF));
      if(k>=.62||rows2===maxRows)break;
    }
    const cwS=cw*k,chS=ch*k;
    const rowsUsed=Math.ceil(hand.length/cols);
    const baseY2=g.h-chS*1.02;
    hand.forEach((c,i)=>{
      const r=Math.floor(i/cols),inRow=Math.min(cols,hand.length-r*cols);
      const j=i-r*cols;
      const rowW=inRow*cwS*gapF-cwS*(gapF-1);
      const x0=g.cx-rowW/2;
      const hot=legalIds.has(c.id),off=focus&&c.s!==focus&&!hot;
      T.set(c.id,{x:x0+j*cwS*gapF,y:baseY2-(rowsUsed-1-r)*chS*.92-(hot?8:0),
        z:hot?30:0,rot:0,faceUp:true,sc:k*(off?.94:1),zi:100+i,
        cls:(hot?'playable ':'')+(off?'dim ':'')+
            (!hot&&st.turn===st.mySeat&&st.phase==='playing'?'dead ':'')+
            (traps.has(c.id)&&hot?'trap ':'')+
            (S.sel.includes(c.id)?'sel ':''),
        hy:baseY2-(rowsUsed-1-r)*chS*.92-62});
    });
  }else{
  const perMax=Math.max(7,Math.floor(handW/(cw*.42)));
  const rows=Math.max(1,Math.ceil(hand.length/perMax));
  const perRow=Math.ceil(hand.length/rows);
  /* the whole fan lives inside the scene, which clips — so the last row's
     bottom edge is the baseline and earlier rows stack above it */
  const baseY=g.h-ch*1.02-(rows-1)*ch*.4;
  let idx=0;
  for(let r=0;r<Math.max(1,rows);r++){
    const slice=hand.slice(r*perRow,(r+1)*perRow);if(!slice.length)break;
    const weights=slice.map(c=>focus?(c.s===focus?1.18:.66):1);
    const pts=fanLayout(slice.length,{radius:cw*2.7,maxSpread:rows>1?34:62,
      maxStep:rows>1?3.4:5.4,maxWidth:handW,weights:rows>1?null:weights});
    slice.forEach((c,i)=>{
      const p=pts[i];
      const hot=legalIds.has(c.id),off=focus&&c.s!==focus&&!hot;
      const lift=hot?-7:off?16:0;
      const sc=off?.72:1;
      T.set(c.id,{x:g.cx+p.x-cw/2,y:baseY-p.y+lift+r*ch*.42,
        z:hot?34:off?-40:0,rot:p.deg,faceUp:true,sc,zi:100+idx,
        cls:(hot?'playable ':'')+(off?'dim ':'')+
            (!hot&&st.turn===st.mySeat&&st.phase==='playing'?'dead ':'')+
            (traps.has(c.id)&&hot?'trap ':'')+
            (S.sel.includes(c.id)?'sel ':''),
        hy:baseY-p.y-72+r*ch*.42});
      idx++;
    });
  }
  }
  /* other seats — fanned backs beside the avatar */
  st.players.forEach(p=>{
    if(p.id===st.mySeat)return;
    const r=relSeat(st,p.id),pt=seatPoint(g,r,st.n,st.n>=6?1:.94);
    const show=Math.min(p.hand.length,st.n>=6?4:7);
    const tilt=pt.row?0:(pt.a*180/Math.PI)+90;
    const ox=pt.row?0:-cw*.18, oy=pt.row?ch*.26:-ch*.2;
    p.hand.forEach((c,i)=>{
      if(i>=show){T.set(c.id,{x:pt.x+ox,y:pt.y+oy,z:0,rot:tilt,faceUp:false,
        sc:.34,zi:10});return}
      const k=i-(show-1)/2;
      T.set(c.id,{x:pt.x+ox+k*cw*.09,y:pt.y+oy+Math.abs(k)*1.4,z:i,
        rot:tilt+k*5,faceUp:false,sc:.36,zi:10+i});
    });
  });
  /* the trick — each card lands short of its owner's seat */
  st.trick.forEach((e,i)=>{
    const r=relSeat(st,e.seat),pt=seatPoint(g,r,st.n,g.land?.24:.26);
    T.set(e.card.id,{x:pt.x-cw/2+e.dx*.4,y:pt.y-ch/2+e.dy*.4,z:24+i*5,
      rot:e.rot,faceUp:true,sc:1,zi:200+i,
      cls:(st.phase==='won'&&i===st.high?'win ':'')});
  });
  /* family furniture */
  if(st.fam==='layout'){
    const cols=4,gapx=Math.min(cw*1.18,g.w/5.4);
    SUITS.forEach((s,si)=>{
      const vals=st.rows[s].slice().sort((a,b)=>a-b);
      vals.forEach((v,i)=>{
        const c=mkCard(RANKS[v-2],s);
        T.set(c.id,{x:g.cx+(si-1.5)*gapx-cw*.34,
          y:g.cy-ch*1.1+i*ch*.2,z:i,rot:0,faceUp:true,sc:.68,zi:40+i});
      });
    });
  }
  if(st.fam==='capture'){
    const opts=S.sel.length?captureOptions(st,S.sel[0]):[];
    const hotLoose=new Set(opts.flatMap(o=>o.loose||[]));
    const hotHouse=new Set(opts.filter(o=>o.house!=null).map(o=>o.house));
    st.floor.loose.forEach((c,i)=>{
      T.set(c.id,{x:g.cx-cw*1.8+i*cw*.95,y:g.cy-ch*.36,z:4,rot:rand(-7,7),
        faceUp:true,sc:.74,zi:40,cls:hotLoose.has(i)?'playable trap ':'playable '});
    });
    st.floor.houses.forEach((h,hi)=>h.cards.forEach((c,i)=>{
      T.set(c.id,{x:g.cx+cw*1.2+i*7,y:g.cy-ch*.36+i*5,z:4+i,rot:-4+i*5,
        faceUp:true,sc:.74,zi:44+i,cls:hotHouse.has(hi)?'playable trap ':'playable '});
    }));
  }
  if(st.fam==='compare'){
    st.groups.forEach((grp,gi)=>grp.forEach((c,i)=>{
      const col=gi%2,row=(gi/2)|0;
      T.set(c.id,{x:g.cx+(col-.5)*g.w*.38-cw*.4+i*cw*.32,
        y:g.cy-ch*.9+row*ch*.9,z:2+i,rot:0,faceUp:true,sc:.6,zi:40+i});
    }));
  }
  if(st.fam==='claim'){
    st.pile.slice(-6).forEach((c,i)=>{
      T.set(c.id,{x:g.cx-cw/2+i*3,y:g.cy-ch/2+i*2,z:2+i,rot:i*4-8,
        faceUp:false,sc:.9,zi:40+i});
    });
  }
  if(st.fam==='draw_discard'){
    const top=st.discard[st.discard.length-1];
    if(top)T.set(top.id,{x:g.cx+cw*.7,y:g.cy-ch/2,z:6,rot:2,faceUp:true,sc:.92,zi:44,
      cls:st.turn===st.mySeat&&st.step==='draw'?'playable ':''});
    st.stock.slice(-4).forEach((c,i)=>{
      T.set(c.id,{x:g.cx-cw*1.6+i*2,y:g.cy-ch/2-i*1.5,z:2+i,rot:-2,faceUp:false,sc:.92,
        zi:40+i,cls:i===3&&st.turn===st.mySeat&&st.step==='draw'?'playable ':''});
    });
  }
  return{T,park,legalIds};
}

function paintCards(opts={}){
  const st=S.g;if(!st)return;
  const layer=document.getElementById('cards');if(!layer)return;
  const g=geom();
  layer.style.setProperty('--cw',g.cw+'px');
  document.documentElement.style.setProperty('--cw',g.cw+'px');
  const{T,park}=computeTargets(st,g);
  const live=new Set();
  const deck=[];
  st.players.forEach(p=>p.hand.forEach(c=>deck.push(c)));
  st.trick.forEach(e=>deck.push(e.card));
  if(st.fam==='capture'){st.floor.loose.forEach(c=>deck.push(c));
    st.floor.houses.forEach(h=>h.cards.forEach(c=>deck.push(c)))}
  if(st.fam==='compare')st.groups.forEach(gr=>gr.forEach(c=>deck.push(c)));
  if(st.fam==='claim')st.pile.slice(-6).forEach(c=>deck.push(c));
  if(st.fam==='layout')SUITS.forEach(s=>st.rows[s].forEach(v=>deck.push(mkCard(RANKS[v-2],s))));
  if(st.fam==='draw_discard'){st.stock.slice(-4).forEach(c=>deck.push(c));
    const t=st.discard[st.discard.length-1];if(t)deck.push(t)}

  deck.forEach(c=>{
    const t=T.get(c.id);if(!t)return;
    live.add(c.id);
    const el=ensureNode(c);
    if(drag&&drag.moved&&drag.id===c.id){        /* this one is under a finger */
      el.className='card dragging '+(t.cls||'');
      live.add(c.id);return;
    }
    const first=el.classList.contains('snap');
    el.className='card '+(t.cls||'');
    if(first){setT(el,{...t,y:t.y-g.h*.55,sc:(t.sc||1)*.8});
      requestAnimationFrame(()=>{el.classList.remove('snap');
        requestAnimationFrame(()=>setT(el,t))});
    }else setT(el,t);
    if(t.hy!=null)el.style.setProperty('--hy',t.hy.toFixed(1)+'px');
    el.setAttribute('aria-label',cardLabel(c)+
      (t.cls&&t.cls.includes('playable')?', playable':t.cls&&t.cls.includes('dead')?', not playable':''));
    el.setAttribute('tabindex',t.cls&&t.cls.includes('playable')?'0':'-1');
  });
  /* anything that has left the table slides away rather than vanishing */
  nodes.forEach((el,id)=>{
    if(live.has(id))return;
    el.className='card gone';
    setT(el,{...park,zi:0});
    if(!el._rm){el._rm=setTimeout(()=>{el.remove();nodes.delete(id)},520*(S.rm?.2:1))}
  });
}

/* ── arranging by hand ─────────────────────────────────────────────────────
   Dragging is how people actually sort a hand, so the cards can be picked up
   and dropped between their neighbours. The first drag switches the ordering
   to "my own" by itself — nobody should have to find a setting first. */
let drag=null,dragBlock=0;
/* ── taking a card back ────────────────────────────────────────────────────
   A snapshot of the whole hand taken the instant before your card leaves your
   hand. It is offered only against bots and only until the trick resolves —
   there is nobody to be unfair to, and nothing has been shown to a person. */
let undoSnap=null;
const canUndo=()=>!!undoSnap&&S.g&&!S.g.over&&
  ['bots','pass'].includes(S.room.way)&&undoSnap.gid===S.g.gid;
function takeSnapshot(st){
  try{undoSnap={gid:st.gid,round:st.round,data:JSON.stringify(st)}}catch(e){undoSnap=null}
}
function undoMove(){
  if(!canUndo())return false;
  let back;try{back=JSON.parse(undoSnap.data)}catch(e){return false}
  clearTimeout(loopT);stopClock();
  undoSnap=null;
  S.g=back;S.sel=[];
  /* the bhabhi is a reference in the live state; after a round trip it is a
     copy, so point it back at the real player */
  if(back.bhabhi)back.bhabhi=back.players[back.bhabhi.id];
  pushLog(back,'You took your card back.','p');
  chromeKey='';paint();step();
  Sfx.flip();return true;
}
function myHandIds(st){
  return arrangeHand(st,st.players[st.mySeat].hand,null).map(c=>c.id);
}
function dragStart(e){
  if(S.screen!=='table'||S.sheet||S.overlay)return;
  const el=e.target.closest&&e.target.closest('#cards .card');if(!el)return;
  const st=S.g;if(!st)return;
  const id=el.dataset.id;
  if(!st.players[st.mySeat].hand.some(c=>c.id===id))return;
  drag={id,el,x0:e.clientX,y0:e.clientY,moved:false};
}
function dragMove(e){
  if(!drag)return;
  const st=S.g;if(!st){drag=null;return}
  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.moved){
    if(Math.hypot(dx,dy)<10)return;
    drag.moved=true;
    if(S.handSort!=='manual'){S.handSort='manual';st.order=myHandIds(st);save()}
    else if(!st.order)st.order=myHandIds(st);
    S.sel=[];
    if(drag.el.setPointerCapture&&e.pointerId!=null)
      try{drag.el.setPointerCapture(e.pointerId)}catch(err){}
    Sfx.tick();Haptics.tap&&Haptics.tap();
    chromeKey='';paint();
  }
  if(e.cancelable)e.preventDefault();
  const layer=document.getElementById('cards');if(!layer)return;
  const r=layer.getBoundingClientRect(),g=geom();
  const px=e.clientX-r.left,py=e.clientY-r.top;
  setT(drag.el,{x:px-g.cw/2,y:py-g.ch/2,z:90,rot:0,faceUp:true,sc:1.08,zi:999});
  /* which slot is the finger over? */
  const {T}=computeTargets(st,g);
  const ids=myHandIds(st);
  let want=ids.length-1;
  for(let i=0;i<ids.length;i++){
    const t=T.get(ids[i]);if(!t)continue;
    if(px<t.x+g.cw*.5){want=i;break}
  }
  const at=ids.indexOf(drag.id);
  if(want!==at&&at>=0){
    ids.splice(want,0,ids.splice(at,1)[0]);
    st.order=ids;
    Sfx.tick();
    paintCards();
  }
}
function dragEnd(){
  if(!drag)return;
  const moved=drag.moved,el=drag.el;
  drag=null;
  if(moved){dragBlock=Date.now();Sfx.place();save();chromeKey='';paint();
    if(el)el.classList.remove('dragging');}
}
document.addEventListener('pointerdown',dragStart);
document.addEventListener('pointermove',dragMove,{passive:false});
document.addEventListener('pointerup',dragEnd);
document.addEventListener('pointercancel',dragEnd);

/* ══ seats ════════════════════════════════════════════════════════════ */
function paintSeats(){
  const st=S.g;if(!st)return;
  const wrap=document.getElementById('seats');if(!wrap)return;
  wrap.innerHTML=seatsHTML(st,geom());
}
function seatsHTML(st,g){
  return st.players.map(p=>{
    if(p.id===st.mySeat)return '';
    const r=relSeat(st,p.id),pt=seatPoint(g,r,st.n,pt0(g,st));
    const turn=st.turn===p.id&&st.phase==='playing';
    const av=st.n>5?28:g.land?34:38;
    const voids=Object.keys(p.voids).filter(k=>p.voids[k]);
    const done=st.finished.indexOf(p.id)>=0;
    const half=st.n>=6?40:50;
    const y=Math.max(av+6,Math.min(g.h-g.ch*1.3,pt.y));
    const x=Math.max(half,Math.min(g.w-half,pt.x));
    return `<div class="seat ${turn?'turn':''}" style="left:${x}px;top:${y}px;--av:${av}px"
        aria-label="${p.name}, ${p.hand.length} cards${turn?', their turn':''}">

      ${st.n<=6?`<div class="rib" style="width:${Math.min(5,p.hand.length)*5+5}px">
        ${Array.from({length:Math.min(5,p.hand.length)},()=>'<i></i>').join('')}</div>`:''}
      <div class="plate">
        <span>${esc(p.name)}</span>
        <span class="cnt ${done?'safe':''}">${done?'✓':p.hand.length}</span>
        ${p.bot?'<span class="botb">BOT</span>':''}
      </div>
      ${done?`<div class="outtag">out · #${st.finished.indexOf(p.id)+1}</div>`:''}
      ${voids.length?`<div class="voidtag">${voids.map(v=>'no '+GLYPH[v]).join(' ')}</div>`:''}
      ${st.gid==='callbreak'?`<span class="chip mini">${p.tricks}/${p.bid}</span>`:''}
      ${turn&&S.timer?`<div class="tbar ${st.left<=4?'low':''}"><i style="transform:scaleX(${(st.left||14)/14})"></i></div>`:''}

const pt0=(g,st)=>st.n>=6?1:(g.land?1.06:1.02);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function feltMotif(){const t=THEMES.find(x=>x[0]===S.theme)||THEMES[0];
  return motif(t[2],t[3],t[4])}
/* ── what the table is asking of you, in one line ──────────────────────────
   The status bar says whose turn it is; this says what to do about it, beside
   your own cards where the decision is actually made. */
function instruction(st){
  if(st.phase!=='playing')return '&nbsp;';
  const me=st.players[st.mySeat];
  if(st.forced)return `Lead the ${esc(RANKNAME[st.forced[0]]||st.forced[0])} of ${
    esc(SUITNAME[st.forced.slice(-1)])}`;
  switch(st.fam){
    case 'trick':case 'inflation':{
      if(!st.trick.length)return 'Your lead — play any card';
      if(!st.leadSuit)return 'Play any card';
      const have=me.hand.some(c=>c.s===st.leadSuit);
      if(!have)return `No ${GLYPH[st.leadSuit]} — ${st.fam==='inflation'
        ?'anything you play breaks the suit':'play anything'}`;
      return `Follow ${GLYPH[st.leadSuit]} ${esc(SUITNAME[st.leadSuit])}`;
    }
    case 'capture':return S.sel.length?'Pick a capture, or throw it down'
      :'Tap a card, then capture or throw';
    case 'compare':return st.up?'Groups locked — waiting on the showdown'
      :'Tap cards, then place them in a group';
    case 'claim':return st.window?'Challenge the claim, or let it stand'
      :`Tap cards and claim them as ${esc(st.rank)}`;
    case 'layout':return legalFor(st,st.mySeat).length?'Play a card that fits a row':'Nothing fits — pass';
    case 'draw_discard':return st.step==='draw'?'Draw from the stock or take the discard'
      :'Throw one card away';
  }
  return 'Your turn';
}
const btn=(label,cls,act)=>`<button class="btn ${cls||''}" data-a="${act}">${label}</button>`;

/* ══ the turn loop ════════════════════════════════════════════════════ */
let loopT=null,clockT=null;
function beginHand(){
  const st=S.g;
  st.phase='dealing';paint();
  Sfx.deal(Math.min(13,st.players[0].hand.length));
  setTimeout(()=>{if(S.g!==st)return;st.phase='playing';paint();step()},760*(S.rm?.25:1));
}
function step(){
  clearTimeout(loopT);
  const st=S.g;if(!st||st.over)return;
  if(st.phase==='thulla'||st.phase==='won'){
    stopClock();
    loopT=setTimeout(()=>{resolve(st);paint();
      if(st.over)return finishHand();step()},st.phase==='thulla'?1650:1050);
    return;
  }
  if(st.phase!=='playing')return;
  /* Families without a trick to resolve end here: once one player or nobody
     is still holding cards there is no move left to make. */
  const left=alive(st);
  if(!st.trick.length&&['layout','claim','capture','compare','draw_discard'].includes(st.fam)
     &&left.length<=(st.fam==='layout'||st.fam==='claim'?1:0)){
    st.bhabhi=left[0]||null;endHand(st);paint();return finishHand();
  }
  /* walk to the next seat that still has cards — a loop, never a recursion */
  let guard=0;
  while(!st.players[st.turn].hand.length&&guard++<st.n)st.turn=nextSeat(st,st.turn);
  if(!st.players[st.turn].hand.length){
    st.bhabhi=null;endHand(st);paint();return finishHand();
  }
  const p=st.players[st.turn];
  if(p.bot){
    stopClock();
    loopT=setTimeout(()=>{
      if(S.g!==st||st.phase!=='playing')return;
      if(st.fam==='draw_discard'){botDrawDiscard(st);paint();return step()}
      const c=botPick(st,p);
      if(!c){st.turn=nextSeat(st,st.turn);paint();return step()}
      playCard(st,p.id,c.id);paint();step();
    },(S.rm?200:620)+Math.random()*320);
  }else{
    startClock();
    paint();
  }
}
function startClock(){
  stopClock();if(!S.timer||S.me.easy)return;
  const st=S.g;st.left=14;
  clockT=setInterval(()=>{
    if(!S.g||S.g!==st||st.turn!==st.mySeat||st.phase!=='playing')return stopClock();
    st.left--;
    if(st.left<=4&&st.left>0)Sfx.tick();
    if(st.left<=0){stopClock();
      const L=legalFor(st,st.mySeat);
      if(L.length){toast('Played for you — the clock ran out.','warn');
        playCard(st,st.mySeat,L[0].id);paint();step()}
      return}
    paintSeats();
  },1000);
}
function stopClock(){clearInterval(clockT);clockT=null;if(S.g)S.g.left=0}
function finishHand(){
  stopClock();
  const st=S.g;
  recordHand(st);
  /* a new hand may have been started in the meantime — never yank the player
     out of a live table into the result screen of a game that is already gone */
  setTimeout(()=>{if(S.g!==st)return;go(st.fam==='trick'?'handresult':'endgame')},700);
}
/* ── the record of a hand ──────────────────────────────────────────────────
   Written once, when the hand actually ends, from the same outcome() the
   result screen reads — so what the profile counts and what the player was
   told are never two different stories. Lessons are not recorded. */
function recordHand(st){
  if(!st||st.lesson||st.recorded)return;
  st.recorded=true;
  const me=st.mySeat,o=outcome(st);
  const place=st.finished.indexOf(me);
  /* outcome().mine means "this hand is about you", which in a liability game
     is the opposite of a win — the Bhabhi is the one who lost it */
  const caught=st.fam==='inflation'&&st.bhabhi&&st.bhabhi.id===me;
  const won=st.conceded?false:(st.fam==='inflation'?!caught:!!o.mine);
  const res=st.conceded?'conceded'
    :st.fam==='inflation'?(caught?'bhabhi':'escaped'):(won?'won':'lost');
  const hour=new Date().getHours();
  S.hist.unshift({
    gid:st.gid,fam:st.fam,n:st.n,t:Date.now(),
    won,res,
    line:(o.line||'').slice(0,120),
    place:place<0?null:place+1,
    thullas:st.thullas[me]||0,
    clean:st.fam==='inflation'&&place>=0&&!st.took[me],
    night:hour<5,
    diff:S.room.botLevel
  });
  S.hist=S.hist.slice(0,200);
  save();
}
function botDrawDiscard(st){
  const p=st.players[st.turn];
  p.hand.push(st.stock.pop()||mkCard('2','S'));
  p.hand.sort(bySuit);
  st.discard.push(p.hand.shift());
  st.turn=nextSeat(st,st.turn);
}

/* ══ interaction ══════════════════════════════════════════════════════ */
function onCardTap(id){
  const st=S.g;if(!st)return;
  const me=st.players[st.mySeat];
  const c=me.hand.find(x=>x.id===id);

  if(st.fam==='draw_discard'&&!c){          /* the stock and the discard pile */
    if(st.turn!==st.mySeat||st.step!=='draw')return;
    const top=st.discard[st.discard.length-1];
    const from=top&&top.id===id?st.discard.pop():st.stock.pop();
    if(!from)return;
    me.hand.push(from);me.hand.sort(bySuit);st.step='discard';Sfx.flip();paint();return;
  }
  if(st.fam==='capture'&&!c){toggleSel(id);return}
  if(!c)return;
  if(st.turn!==st.mySeat||st.phase!=='playing'){
    toast(`Not your turn yet — ${st.players[st.turn].name} is playing.`);return;
  }
  const legal=legalFor(st,st.mySeat);
  const ok=legal.some(x=>x.id===c.id);

  if(st.fam==='compare'||st.fam==='claim'||st.fam==='capture'){toggleSel(id);return}
  if(!ok){
    Haptics.err();
    const why=st.forced?`The ${RANKNAME[st.forced[0]]||st.forced[0]} of ${SUITNAME[st.forced.slice(-1)]} has to be led first.`
      :`You still hold ${GLYPH[st.leadSuit]} — you have to follow the suit.`;
    toast(why,'bad');
    const el=nodes.get(id);if(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),480)}
    return;
  }
  /* a thumb is not a cursor: first tap lifts the card, second plays it */
  if(S.sel[0]!==id&&matchMedia('(hover:none)').matches){
    S.sel=[id];Sfx.flip();Haptics.tap();paint();return;
  }
  S.sel=[];
  takeSnapshot(st);
  playCard(st,st.mySeat,id);
  stopClock();paint();step();
}
function toggleSel(id){
  const i=S.sel.indexOf(id);
  if(i>=0)S.sel.splice(i,1);else S.sel.push(id);
  Haptics.tap();paint();
}

/* ══ one paint ════════════════════════════════════════════════════════ */
let chromeKey='';
function paint(){
  const st=S.g;if(!st||S.screen!=='table')return;
  const host=document.getElementById('table');if(!host)return;
  /* the frame is rebuilt only when its words change; the cards never are */
  const key=[st.phase,st.turn,st.banner,st.trick.length,st.flash,S.sel.join(),
    S.chat,S.unread,st.log[0]&&st.log[0].id,st.mood,S.tracker,S.mic].join('|');
  if(key!==chromeKey){
    chromeKey=key;
    const prev=document.getElementById('cards');
    host.innerHTML=tableChrome();
    if(prev){const now=document.getElementById('cards');
      now.replaceWith(prev);}                       /* keep the live card nodes */
  }
  paintCards();paintSeats();
  if(st.flash){setTimeout(()=>{st.flash=0;chromeKey='';paint()},950)}
  if(st.shake){setTimeout(()=>{st.shake=0},520)}
}

V.games=()=>{

  const shown=GAMES.filter(pass);
  const chips=[['all','All',GAMES.length],['ready','Ready',GAMES.filter(g=>g.status==='ready').length],

/* ── the little scene on every catalogue card ──────────────────────────────
   Each family gets its own arrangement of real cards rather than the same
   three white rectangles: a trick being taken, a pile being broken, cards
   lifted off a floor. The cards are the same 3D component the table uses, so
   the catalogue looks like the game it is selling. On hover they spread. */
function gameArt(g){
  const S1=g.suit==='♠'?'S':g.suit==='♥'?'H':g.suit==='♦'?'D':'C';
  const other=S1==='S'?'H':S1==='H'?'S':S1==='D'?'C':'D';
  const c=(r,s,st,cls)=>`<div class="ac ${cls||''}" style="${st}">${
    cardHTML(mkCard(r,s),false,26)}</div>`;
  const back=(st,cls)=>`<div class="ac ${cls||''}" style="${st}">${cardHTML(null,true,26)}</div>`;
  const P='position:absolute;left:50%;top:50%;';
  switch(g.fam){
    case 'trick':return c('9',other,P+'--t:translate(-50%,-50%) translate(-26px,4px) rotate(-16deg)','a1')
      +c('K',S1,P+'--t:translate(-50%,-50%) translate(0,-6px) rotate(0deg);z-index:3','a2')
      +c('7',other,P+'--t:translate(-50%,-50%) translate(26px,4px) rotate(16deg)','a3');
    case 'inflation':return back(P+'--t:translate(-50%,-50%) translate(-14px,6px) rotate(-8deg)','a1')
      +back(P+'--t:translate(-50%,-50%) translate(-6px,2px) rotate(4deg)','a2')
      +c('A',S1,P+'--t:translate(-50%,-50%) translate(26px,-10px) rotate(22deg);z-index:3','a3');
    case 'capture':return c('4',other,P+'--t:translate(-50%,-50%) translate(-28px,10px) rotate(-4deg)','a1')
      +c('6',S1,P+'--t:translate(-50%,-50%) translate(2px,10px) rotate(3deg)','a2')
      +c('10',S1,P+'--t:translate(-50%,-50%) translate(-12px,-14px) rotate(-10deg);z-index:3','a3');
    case 'compare':return c('A',S1,P+'--t:translate(-50%,-50%) translate(-30px,0) rotate(-5deg)','a1')
      +c('K',S1,P+'--t:translate(-50%,-50%) translate(0,0) rotate(0deg);z-index:3','a2')
      +c('Q',other,P+'--t:translate(-50%,-50%) translate(30px,0) rotate(5deg)','a3');
    case 'layout':return c('7',S1,P+'--t:translate(-50%,-50%) translate(0,-2px) rotate(0deg);z-index:3','a2')
      +c('8',S1,P+'--t:translate(-50%,-50%) translate(-30px,6px) rotate(-3deg)','a1')
      +c('6',other,P+'--t:translate(-50%,-50%) translate(30px,6px) rotate(3deg)','a3');
    case 'claim':return back(P+'--t:translate(-50%,-50%) translate(-16px,6px) rotate(-9deg)','a1')
      +back(P+'--t:translate(-50%,-50%) translate(0,0) rotate(3deg);z-index:2','a2')
      +c('2',S1,P+'--t:translate(-50%,-50%) translate(24px,-6px) rotate(16deg);z-index:3','a3');
    default:return back(P+'--t:translate(-50%,-50%) translate(-24px,2px) rotate(-5deg)','a1')
      +c('J',S1,P+'--t:translate(-50%,-50%) translate(16px,-2px) rotate(7deg);z-index:3','a3')
      +c('9',other,P+'--t:translate(-50%,-50%) translate(6px,8px) rotate(2deg)','a2');
  }
}
function gameCard(g,i){
  const fav=S.fav.has(g.id),ready=g.status==='ready';
  const red=g.suit==='♥'||g.suit==='♦';
  return `<div class="gcard ${ready?'':'draft'}" style="--i:${i%14}">
    <div class="art" data-a="detail:${g.id}">

/* ── same Wi-Fi, hotspot, rooms ───────────────────────────────────────── */
function qrSVG(){let sd=7;const rn=()=>{sd=(sd*1103515245+12345)&2147483647;return sd/2147483647};
  const n=21,s=5;let c='';
  const fi=(x,y)=>(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){let on;
    if(fi(x,y)){const lx=x<7?x:x-(n-7),ly=y<7?y:y-(n-7);
      on=lx===0||lx===6||ly===0||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4)}
    else on=rn()>.52;
    if(on)c+=`<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}"/>`}
  return `<div class="qr"><svg width="${n*s}" height="${n*s}" viewBox="0 0 ${n*s} ${n*s}"
    fill="#111" role="img" aria-label="Join code"> ${c}</svg></div>`}

/* ── how a hand reads at the end depends on what the family was playing for:
   a liability game names the one left holding, a shedding game names the one
   who got out first, a capture game names the winning pair, Hazari settles
   group against group, and Marriage counts what is still in hand. ───────── */
function outcome(st){
  const me=st.mySeat,nm=id=>st.players[id].name;
  const order=()=>st.finished.map((id,i)=>[`${i+1}. ${esc(nm(id))}`,'out'])
    .concat(st.bhabhi?[[`${st.finished.length+1}. ${esc(st.bhabhi.name)}`,
      `left with ${st.bhabhi.hand.length}`]]:[]);
  if(st.fam==='inflation'){
    const b=st.bhabhi,iAm=b&&b.id===me;
    return{mine:iAm,head:b?esc(b.name):'Draw',
      lab:iAm?'This hand goes against you':'The hand is over',
      line:b?(iAm?'You were left holding the cards. That makes you the Bhabhi.'
              :`${esc(b.name)} was left holding the cards.`)
            :'Everybody emptied their hand in the same trick.',
      title:'Finishing order',rows:order()};
  }
  if(st.fam==='layout'||st.fam==='claim'){
    const w=st.finished.length?st.finished[0]:null,iAm=w===me;
    return{mine:iAm,head:w===null?'Draw':esc(nm(w)),
      lab:iAm?'You got out first':'The hand is over',
      line:w===null?'Nobody managed to get out.'
        :st.fam==='layout'
          ?(iAm?'You laid off every card before anyone else.'
              :`${esc(nm(w))} laid off every card first.`)
          :(iAm?'You emptied your hand and nobody caught you.'
              :`${esc(nm(w))} emptied their hand without being caught.`),
      title:'Finishing order',rows:order()};
  }
  if(st.fam==='capture'){
    const mineTeam=me%2,a=st.score[mineTeam]||0,b=st.score[1-mineTeam]||0;
    const side=t=>st.players.filter(p=>p.id%2===t).map(p=>p.id===me?'You':p.name).join(' & ');
    return{mine:a>b,head:a===b?'Level':esc(side(mineTeam===0?0:1)),
      lab:a===b?'The floor is clear':a>b?'Your pair takes it':'The other pair takes it',
      line:a===b?`Both pairs finished on ${a}.`
        :`${esc(side(a>b?mineTeam:1-mineTeam))} swept ${Math.max(a,b)} to ${Math.min(a,b)}.`,
      title:'Points this hand',
      rows:[[esc(side(mineTeam)),String(a)],[esc(side(1-mineTeam)),String(b)]]};
  }
  if(st.fam==='compare'){
    const sd=st.showdown||[],top=sd[0];
    return{mine:!!(top&&top.me),head:top?esc(top.me?'You':top.name):'Locked',
      lab:top&&top.me?'Your groups held':'Groups compared',
      line:top?`${esc(top.me?'You':top.name)} won ${top.wins} of the four groups.`
             +' Groups are settled one against one, strongest first.'
            :'The groups were never locked.',
      title:'Groups won',
      rows:sd.map(r=>[esc(r.me?'You':r.name),
        `${r.wins} · ${r.w.map(v=>v).join('/')}`])};
  }
  if(st.fam==='draw_discard'){
    const rank=[...st.players].sort((a,b)=>a.hand.length-b.hand.length);
    const top=rank[0],iAm=top.id===me;
    return{mine:iAm,head:esc(iAm?'You':top.name),
      lab:iAm?'You are closest to out':'The stock ran dry',
      line:`${esc(iAm?'You are':top.name+' is')} holding the fewest cards`
        +` — ${top.hand.length} left. Maal scoring for unseen players is still an open rule.`,
      title:'Cards still in hand',
      rows:rank.map(p=>[esc(p.id===me?'You':p.name),String(p.hand.length)])};
  }
  const b=st.bhabhi;
  return{mine:false,head:b?esc(b.name):'Hand over',lab:'The hand is over',
    line:'',title:'Finishing order',rows:order()};
}

/* ── when a hand was played, in words a person uses ──────────────────────── */
function whenWord(t){
  const d=new Date(t),now=new Date();
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((day(now)-day(d))/86400000);
  if(diff===0)return 'Today';
  if(diff===1)return 'Yesterday';
  if(diff<7)return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'});
}

/* ── leaving a match ──────────────────────────────────────────────────────
   The old dialog was one line of copy in a full-width sheet, which is both
   too big and too thin: what a player actually wants to know before walking
   away is who plays their cards, whether the seat survives, and what happens
   to the hand in progress. So it answers those three, shows where they stand
   right now, and offers the pause they may have meant instead. */
function leaveHTML(){
  const st=S.g;
  if(!st)return '';
  const gm=G(st.gid),me=st.players[st.mySeat];
  const online=['room','wifi','hotspot','quick'].includes(S.room.way);
  const mid=!st.over;          /* a dealt hand counts, even mid-deal */
  const facts=[
    ['B','A bot finishes your seat',
      'It plays your hand out under the same house rules, so the others can keep going.'],
    online
      ?['R','Your seat is kept while the room is live',
        `Rejoin with ${esc(S.room.code||'the room code')} and you take over at your next turn.`]
      :['H','This hand ends here',
        'A game against bots is not held open — leaving closes the table for good.'],
    [mid?'!':'·',mid?'The hand in progress is dropped':'Nothing is in progress',
      mid?'No result is recorded for it, and the running score goes with it.'
         :'You can leave without losing anything.']
  ];
  const standing=[`${me.hand.length} in hand`];
  if(st.fam==='trick')standing.push(`${me.tricks}/${me.bid} tricks`,`round ${st.round}`);
  else if(st.fam==='capture')standing.push(`${st.score[0]} points`);
  else if(st.finished.length)standing.push(`${st.finished.length} already out`);
  standing.push(`${st.n} seats`);
  return `<div class="scrim" data-a="scrim"><div class="sheet mini" role="dialog"
    aria-modal="true" aria-label="Leave this match">
    <h2 class="t">Leave this match?</h2>
    <div class="standing"><span class="chip mini">${esc(gm.name)}</span>${
      standing.map(x=>`<span class="chip mini">${esc(x)}</span>`).join('')}</div>
    <div class="facts">${facts.map(([ic,t,b])=>`<div class="fact"><i>${ic}</i>
      <span><b>${t}</b>${b}</span></div>`).join('')}</div>
    <button class="btn dan" data-a="ov:leave">Leave the match</button>
    <button class="btn pri" data-a="ov:close">Stay at the table</button>
    <p class="alt">Only stepping away for a moment?
      <button data-a="ov:pause">Pause the table instead</button></p>
  </div></div>`;
}
/* ── conceding ────────────────────────────────────────────────────────────
   Different from leaving: the hand is settled here and now, against you, and
   the table plays on. Worth saying plainly before it is done. */
function concedeHTML(){
  const st=S.g;if(!st)return '';
  const gm=G(st.gid),me=st.players[st.mySeat];
  const facts=[
    ['1','The hand ends immediately',
      st.fam==='inflation'?'You are recorded as the Bhabhi for this hand.'
        :'It is recorded as a loss for you.'],
    ['2','Your record keeps it',
      'Conceded hands count as played — they are not quietly dropped.'],
    ['3','Nothing else is lost',
      'The table, the seats and your setup stay exactly as they are for the next deal.']];
  return `<div class="scrim" data-a="scrim"><div class="sheet mini" role="dialog"
    aria-modal="true" aria-label="Concede this hand">
    <h2 class="t">Concede this hand?</h2>
    <div class="standing"><span class="chip mini">${esc(gm.name)}</span>
      <span class="chip mini">${me.hand.length} in hand</span>
      <span class="chip mini">${st.n} seats</span></div>
    <div class="facts">${facts.map(([ic,t,b])=>`<div class="fact"><i>${ic}</i>
      <span><b>${t}</b>${b}</span></div>`).join('')}</div>
    <button class="btn dan" data-a="ov:concedeYes">Concede</button>
    <button class="btn pri" data-a="ov:close">Keep playing</button>
  </div></div>`;
}
function overlayHTML(){
  if(!S.overlay)return '';
  if(S.overlay==='leave'){const h=leaveHTML();if(h)return h}
  if(S.overlay==='concede'){const h=concedeHTML();if(h)return h}
  const o=OV[S.overlay];if(!o)return '';
  const [t,b,btns]=o;
  return `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t)}">
    <h2 class="t">${esc(t)}</h2><div class="cap" style="font-size:13.2px">${b}</div>
    <div class="gap" style="min-height:4px"></div>
    ${btns.map(([l,a,c],i)=>`<button class="btn ${c||(i===0?'pri':'')}" data-a="ov:${a}">${l}</button>`).join('')}
  </div></div>`;
}

          aria-pressed="${S.me.avatar===i}">${avatarSVG(i,26)}</button>`).join('')}</div>
      <div class="lab" style="margin-top:8px">Your name</div>
      <div class="field" style="margin-top:5px">
        <input id="nm2" value="${esc(S.me.name)}" data-live="nm" maxlength="24"
          aria-label="Your table name" placeholder="Type a name"></div>
      <button class="btn sm" style="margin-top:7px" data-a="name:new">Suggest another</button>
      <button class="btn" style="margin-top:7px" data-a="closesheet">Done</button></div></div>`;
  }
  if(S.sheet==='tracker'){
    const st=S.g;
    return `<div class="scrim toBottom" data-a="scrim"><div class="sheet bottom">
      <h2 class="t">What has gone</h2>
      <p class="cap">Struck-through cards have already been played this hand. Anything that
        goes back into a hand is un-struck.</p>
      ${SUITS.map(s=>`<div class="row" style="gap:8px;margin-top:6px">
        <span style="width:18px;font-size:16.5px;color:${suitColour(s)==='var(--suit-black)'?'var(--ivory)':suitColour(s)}">${GLYPH[s]}</span>
        <div class="tracker">${RANKS.slice().reverse().map(r=>
          `<i class="${st.seen[r+s]?'gone':''}">${r}</i>`).join('')}</div></div>`).join('')}
      <button class="btn pri" data-a="closesheet">Close</button></div></div>`;
  }
  if(S.sheet==='capture'){
    const st=S.g,opts=captureOptions(st,S.sel[0]);
    return `<div class="scrim toBottom" data-a="scrim"><div class="sheet bottom">
      <h2 class="t">Which capture?</h2>
      <p class="cap">Every option the rules allow is listed. Which one a player must take
        is not settled for Seep (G-30), so the choice stays yours.</p>
      ${opts.map((o,i)=>`<button class="btn" data-a="cap:${i}">${esc(o.label)}</button>`).join('')}
      <button class="btn" data-a="closesheet">Cancel</button></div></div>`;
  }
  if(S.sheet==='hint'){
    const st=S.g,me=st.players[st.mySeat];
    const L=legalFor(st,st.mySeat);
    const traps=st.fam==='inflation'?trapCards(st,me):new Set();
    const pick=L.find(c=>traps.has(c.id))||botPick(st,{...me,id:st.mySeat});
    return `<div class="scrim" data-a="scrim"><div class="sheet">
      <h2 class="t">A suggestion</h2>
      <div class="row" style="gap:14px;align-items:center">
        ${pick?cardHTML(pick,false,72):''}
        <p class="cap" style="flex:1;font-size:13.2px">${pick?(traps.has(pick.id)
          ?`Lead the ${pick.r}${pick.g}. At least one seat has shown it is out of ${SUITNAME[pick.s].toLowerCase()}, so somebody will have to break the suit and pick the pile up.`
          :st.trick.length?`The ${pick.r}${pick.g} follows the suit without spending a high card.`
          :`The ${pick.r}${pick.g} is the safest lead from this hand.`)
          :'Nothing is playable right now.'}</p></div>
      <p class="cap">Hints read the same table you can see. They never look at anybody's hand.</p>
      <button class="btn pri" data-a="closesheet">Back to the game</button></div></div>`;
  }
  return '';
}

function go(name,back){
  if(S.screen==='table'&&name!=='table'){stopClock();clearTimeout(loopT)}
  S.screen=name;S.sheet=null;S.overlay=null;
  if(name!=='table')chromeKey='';
  const map={home:'play',games:'games',me:'me',settings:'settings'};
  if(map[name])S.tab=map[name];
  render(back);
}
function render(back){
  const app=document.getElementById('app');
  if(S.screen==='table'){
    app.innerHTML='<div class="screen" id="table"></div>'+chatHTML()+sheetHTML()+overlayHTML();
    nodes.forEach(el=>el.remove());nodes.clear();chromeKey='';
    paint();
  }else{
    const v=V[S.screen]||V.home;
    app.innerHTML=v()+sheetHTML()+overlayHTML();
    if(back)app.firstElementChild.classList.add('back');
  }
  if(S.toast)showToast();
  const box=document.getElementById('msgs');if(box)box.scrollTop=box.scrollHeight;
}
let toastT=null;
function toast(msg,kind){
  S.toast={msg,kind};
  const old=document.querySelector('.toast');if(old)old.remove();
  showToast();
  clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;
    const t=document.querySelector('.toast');if(t)t.remove()},2600);
}
function showToast(){
  if(!S.toast)return;
  const d=document.createElement('div');
  d.className='toast '+(S.toast.kind||'');d.setAttribute('role','status');
  d.textContent=S.toast.msg;document.body.appendChild(d);
}
