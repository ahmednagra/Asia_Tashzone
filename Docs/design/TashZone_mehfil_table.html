const ROUTE_BACK={'ob-year':'ob-lang','ob-mode':'ob-year','ob-name':'ob-mode',
  detail:'games',ways:'detail',setup:'ways',appearance:'settings',setplay:'settings'};
document.addEventListener('click',e=>{
  Sfx.unlock();
  const card=e.target.closest('#cards .card');
  /* a card that was just dragged into place must not also be played */
  if(card){if(Date.now()-dragBlock>250)onCardTap(card.dataset.id);return}
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(a==='scrim'&&e.target!==el)return;
  act(a,el);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.sheet||S.overlay){S.sheet=null;S.overlay=null;render()}return}
  if(e.key==='Enter'||e.key===' '){
    const c=document.activeElement&&document.activeElement.closest('#cards .card');
    if(c){e.preventDefault();onCardTap(c.dataset.id)}}
});
document.addEventListener('input',e=>{
  const l=e.target.dataset&&e.target.dataset.live;if(!l)return;
  if(l==='q'){S.query=e.target.value;
    const sel=e.target.selectionStart;render();
    const n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(sel,sel)}}
  if(l==='join')S.joinCode=e.target.value.toUpperCase();
  if(l==='nm'){
    S.me.name=e.target.value.slice(0,24);save();
    const sel=e.target.selectionStart,id=e.target.id;
    render();
    const n=document.getElementById(id);
    if(n){n.focus();try{n.setSelectionRange(sel,sel)}catch(err){}}
  }
});

function act(a,el){
  const [k,v]=a.split(':');
  switch(k){
    case 'nav':go(v,ROUTE_BACK[S.screen]===v);break;
    case 'tab':go({play:'home',games:'games',me:'me',settings:'settings'}[v]);break;
    case 'lang':S.me.lang=v;S.rtl=v==='ur';applyTheme();save();render();break;
    case 'drum':S.drumYear=Math.max(1930,Math.min(new Date().getFullYear(),S.drumYear+ +v));render();break;
    case 'year':
      if(v==='set'){S.me.born=S.drumYear;
        S.me.protectedMode=new Date().getFullYear()-S.drumYear<13;}
      else{S.me.protectedMode=true;S.parent.text=false}
      save();go('ob-mode');break;
    case 'easy':S.me.easy=v==='1';
      if(S.me.easy){S.four=true;S.big=true;S.hints=true;S.timer=false}
      applyTheme();save();render();break;
    case 'av':S.me.avatar=+v;save();render();break;
    case 'name':
      if(v==='clear'){S.me.name='';save();render();break}
      S.me.name=NICKS[Math.floor(Math.random()*NICKS.length)];save();render();break;
    case 'finish':save();go('home');break;
    case 'detail':S.detail=v;S.room.game=v;S.detailTab='quick';applyCfg(v);go('detail');break;
    case 'gfilter':S.gfilter=v;render();break;
    case 'badge':{const b=BADGES.find(x=>x.t===decodeURIComponent(v));if(!b)break;
      const s2=stats(),[have,need]=b.at(s2);
      toast(have>=need?b.t+' — earned. '+b.how:b.t+' — '+have+' of '+need+'. '+b.how);break}
    case 'sheet':S.sheet=v;render();break;
    case 'hlay':S.handLay=v;save();chromeKey='';render();break;
    case 'hsort':S.handSort=v;if(S.g)S.g.order=null;save();chromeKey='';render();break;
    case 'dtab':S.detailTab=v;render();break;
    case 'fav':S.fav.has(v)?S.fav.delete(v):S.fav.add(v);save();render();break;
    case 'preset':S.room.preset=+v;writeCfg(S.room.game,{preset:+v});
      toast('Preset in play: '+(G(S.room.game).presets[+v]||'Standard'));render();break;
    case 'ways':S.room.game=v;S.detail=v;applyCfg(v);go('ways');break;
    /* one tap from anywhere: the game's own remembered setup, dealt at once */
    case 'playnow':{const gid=v||S.detail;applyCfg(gid);S.room.way='bots';
      writeCfg(gid,{way:'bots'});startGame();break}
    case 'cway':writeCfg(S.detail,{way:v});S.room.way=v;render();break;
    case 'startway':{const c=applyCfg(S.detail);
      if(c.way==='bots')startGame();
      else go({wifi:'wifihost',hotspot:'hotspot',pass:'pass',room:'room',quick:'room'}[c.way]||'setup');
      break}
    case 'way':
      S.room.way=v;
      go({bots:'setup',wifi:'wifihost',hotspot:'hotspot',pass:'pass',room:'room',quick:'room'}[v]);break;
    case 'soon':toast(`${WAYS[v][0]} is not ready for ${G(S.room.game).name} yet.`,'warn');break;
    case 'seats':{const g=G(S.room.game);
      S.room.seats=Math.max(g.seats[0],Math.min(g.seats[1],S.room.seats+ +v));
      writeCfg(S.room.game,{seats:S.room.seats});render();break}
    case 'lvl':S.room.botLevel=+v;writeCfg(S.room.game,{diff:+v});applyCfg(S.room.game);render();break;
    case 'hands':S.room.hands=+v;writeCfg(S.room.game,{hands:+v});render();break;
    case 'rule':S.rules[v]=!S.rules[v];
      writeCfg(S.room.game,{rules:Object.assign({},S.rules)});
      if(S.g&&!S.g.over){S.g.rules[v]=S.rules[v];
        toast(v==='aceOpens'?'The opening rule waits for the next deal'
          :'House rule applied to this hand')}
      save();render();if(S.screen==='table')paint();break;
    case 'start':startGame();break;
    case 'quick':S.room.game=v;S.detail=v;applyCfg(v);S.room.way='bots';startGame();break;
    case 'lesson':S.room.game=v;startGame(true);break;
    case 'nextround':{const st=S.g;S.g=newGame(st.gid,{seats:st.n,round:st.round+1});
      go('table');beginHand();break}
    case 'rematch':{const st=S.g;S.g=newGame(st?st.gid:S.room.game,{seats:st?st.n:S.room.seats});
      go('table');beginHand();break}
    case 'leave':stopClock();S.g=null;S.interrupted=false;go('home');break;
    case 'makeroom':S.room.code=mkCode();go('wait');break;
    case 'joinroom':{const c=(S.joinCode||'').toUpperCase();
      if(c.length<6){toast('A room code is six letters and numbers.','bad');break}
      S.room.code=c;go('wait');break}
    case 'err':S.overlay={LOCKED:'ROOM_LOCKED',WAIT:'JOIN_PENDING',OLDAPP:'UPDATE_REQUIRED',
      GONE:'ROOM_EXPIRED',BLOCK:'BLOCKED'}[v];render();break;
    case 'copy':toast('Copied.');break;
    case 'approve':S.room.approve=!S.room.approve;render();break;
    case 'lockroom':S.room.locked=!S.room.locked;render();break;
    case 'key':S.pin=v==='⌫'?S.pin.slice(0,-1):(S.pin+v).slice(0,4);
      if(S.pin.length===4){S.pin='';toast('Joining the host…');setTimeout(()=>act('start:bots'),700)}
      render();break;
    case 'pkey':S.pin=v==='⌫'?S.pin.slice(0,-1):(S.pin+v).slice(0,4);
      if(S.pin.length===4){S.parent.pin=S.pin;S.pin='';save();toast('Parent PIN set.');go('parent')}
      else render();break;
    case 'theme':S.theme=v;applyTheme();save();render();break;
    case 'pal':S.pal='a';applyTheme();save();render();break;
    case 'mode':S.mode=v;applyTheme();save();render();break;
    case 'toggle':{
      const m={four:'four',big:'big',rm:'rm',rtl:'rtl',hints:'hints',timer:'timer',
        tracker:'tracker',sound:'sound',haptics:'haptics'};
      if(v==='open'){
        const st=S.g;if(!st)break;
        st.open=!st.open;
        pushLog(st,st.open?'You put your hand face up on the table.'
          :'Your hand is hidden again.','p');
        chromeKey='';paint();if(S.sheet)render();break}
      if(v==='easy'){S.me.easy=!S.me.easy;
        if(S.me.easy){S.four=true;S.big=true;S.hints=true;S.timer=false}}
      else if(m[v]){S[v]=!S[v];if(v==='sound')Sfx.setOn(S.sound)}
      applyTheme();save();
      if(S.screen==='table'){chromeKey='';paint();if(S.sheet)render()}else render();
      break}
    case 'ptoggle':S.parent[v]=!S.parent[v];save();render();break;
    case 'act':tableAct(v);break;
    case 'ov':ovAct(v);break;
    case 'sheet':S.sheet=v;render();break;
    case 'closesheet':S.sheet=null;render();break;
    case 'cap':{const st=S.g;doCapture(st,captureOptions(st,S.sel[0])[+v]);
      S.sheet=null;render();break}
    case 'qc':{const t=decodeURIComponent(v);
      S.msgs.push({n:S.me.name||'You',t,me:true});Sfx.flip();render();botReply();break}
    case 'sendchat':{const box=document.getElementById('ctext');
      if(box&&box.value.trim()){S.msgs.push({n:S.me.name||'You',t:box.value.trim().slice(0,200),me:true});
        box.value='';render();botReply()}break}
    case 'toast':toast(v);break;
    case 'demo':Sfx.place();Haptics.release();toast('That is the sound a card makes.');break;
    case 'export':toast('Your data has been copied as text.');break;
    case 'wipe':try{localStorage.removeItem(LS)}catch(e){}
      location.reload();break;
  }
}
function tableAct(v){
  const st=S.g;
  switch(v){
    case 'menu':S.sheet='menu';render();break;
    case 'mic':
      if(!S.parent.voice&&!S.mic){S.overlay='permission';render();break}
      if(S.mic){Voice.stop();S.mic=false;chromeKey='';render();toast('Microphone off.');break}
      Voice.start().then(()=>{S.mic=true;chromeKey='';render();
        toast('Microphone on — you are live at the table.')})
        .catch(err=>{S.mic=false;chromeKey='';render();
          toast(/denied|NotAllowed/i.test(err&&(err.name+err.message))
            ?'The browser blocked the microphone. Allow it in the site settings.'
            :(err&&err.message)||'No microphone available.','bad')});
      break;
    case 'chat':S.chat=!S.chat;S.unread=0;chromeKey='';paint();
      document.querySelectorAll('.side').forEach(n=>n.remove());
      if(S.chat)document.getElementById('app').insertAdjacentHTML('beforeend',chatHTML());
      break;
    case 'tracker':S.sheet='tracker';render();break;
    case 'hint':S.sheet='hint';render();break;
    case 'pass':toast('Passed — nothing playable.');st.turn=nextSeat(st,st.turn);paint();step();break;
    case 'throw':{const me=st.players[st.mySeat];const c=me.hand.find(x=>x.id===S.sel[0]);
      if(!c)break;me.hand=me.hand.filter(x=>x.id!==c.id);st.floor.loose.push(c);
      S.sel=[];Sfx.place();pushLog(st,'You throw the '+c.r+c.g+' to the floor.');
      st.turn=nextSeat(st,st.turn);paint();break}
    case 'arrange':S.sheet='arrange';render();break;
    case 'undo':if(!undoMove())toast('Nothing to take back.');break;
    case 'last':S.sheet='last';render();break;
    case 'mvl':case 'mvr':
      if(S.sel.length===1&&moveCard(st,S.sel[0],v==='mvl'?-1:1)){Sfx.tick();chromeKey='';paint()}
      break;
    case 'cap0':doCapture(st,captureOptions(st,S.sel[0])[0]);paint();break;
    case 'capmany':S.sheet='capture';render();break;
    case 'up':if(!groupsFull(st))break;st.up=true;
      toast('Locked. The others see only “Arranged”.');paint();break;
    case 'clear':{const me=st.players[st.mySeat];
      st.groups.forEach(gr=>{me.hand.push(...gr)});st.groups=[[],[],[],[]];
      me.hand.sort(bySuit);S.sel=[];paint();break}
    case 'grp0':case 'grp1':case 'grp2':case 'grp3':
      placeGroup(st,+v.slice(3));paint();break;
    case 'claim':playCard(st,st.mySeat,null);paint();
      if(st.window)runWindow();break;
    case 'challenge':{const w=st.window;st.window=null;
      const liar=w&&!w.truth;
      const taker=liar?st.players.find(p=>p.name===w.who):st.players[st.mySeat];
      taker.hand=taker.hand.concat(st.pile).sort(bySuit);st.pile=[];st.claim=null;
      pushLog(st,liar?`A bluff — ${w.who} takes the pile.`:`It was true — you take the pile.`,'t');
      st.banner=liar?'Caught!':'True claim';st.flash++;Sfx.slam();Haptics.thulla();
      st.turn=st.mySeat;paint();setTimeout(()=>{st.banner=null;chromeKey='';paint()},1400);break}
    case 'letgo':st.window=null;st.claim=null;st.turn=st.mySeat;paint();break;
    case 'draw':{const me=st.players[st.mySeat];const c=st.stock.pop();
      if(c){me.hand.push(c);me.hand.sort(bySuit);st.step='discard';Sfx.flip();paint()}break}
    case 'take':{const me=st.players[st.mySeat];const c=st.discard.pop();
      if(c){me.hand.push(c);me.hand.sort(bySuit);st.step='discard';Sfx.flip();paint()}break}
  }
}
function ovAct(v){
  switch(v){
    case 'close':S.overlay=null;render();break;
    case 'leaveask':S.sheet=null;S.overlay='leave';render();break;
    case 'concede':S.sheet=null;S.overlay='concede';render();break;
    case 'concedeYes':{
      const st=S.g;S.overlay=null;
      if(!st||!['bots','pass'].includes(S.room.way)){render();break} /* offline only */
      stopClock();
      st.conceded=true;
      if(st.fam==='inflation')st.bhabhi=st.players[st.mySeat];
      endHand(st);paint();finishHand();
      break}
    case 'leave':stopClock();S.g=null;S.overlay=null;go('home');break;
    case 'reconnect':S.overlay='reconnecting';render();
      setTimeout(()=>{S.overlay=null;render();toast('Back at the table — you take over at your next move.')},1500);break;
    case 'interrupted':S.interrupted=true;S.overlay=null;go('match');break;
    case 'makeroom':S.room.code=mkCode();S.overlay=null;go('wait');break;
    case 'toparent':S.overlay=null;go('parent');break;
    case 'rematch':act('rematch:');break;
    case 'copy':toast('Copied c9f2-41ab.');S.overlay=null;render();break;
    case 'pause':S.sheet=null;S.overlay='pause';render();break;
  }
}
function mkCode(){const a='BCDFGHJKLMNPQRSTVWXZ23456789';
  return Array.from({length:6},()=>a[Math.floor(Math.random()*a.length)]).join('')}
function startGame(lesson){
  const gid=S.room.game;
  S.recent=[gid,...S.recent.filter(x=>x!==gid)].slice(0,5);
  S.sel=[];S.msgs=[];S.unread=0;S.interrupted=false;
  S.g=newGame(gid,{seats:S.room.seats,lesson});
  save();go('table');beginHand();
  const fam=G(gid).fam;
  if(!lesson&&S.hints){setTimeout(()=>{
    if(S.screen!=='table')return;
    const c=document.createElement('div');c.className='coach';
    c.style.bottom=(geom().ch*1.4+70)+'px';
    c.innerHTML=`${esc(FAM_HINT[fam])}<br><small style="opacity:.7">Tap to dismiss</small>`;
    c.onclick=()=>c.remove();
    document.getElementById('app').appendChild(c);
    setTimeout(()=>c.remove(),9000);
  },1100)}
}
let winT=null;
function runWindow(){
  clearInterval(winT);
  const st=S.g;
  winT=setInterval(()=>{
    if(!S.g||S.g!==st||!st.window)return clearInterval(winT);
    st.window.left--;
    if(st.window.left<=0){clearInterval(winT);st.window=null;st.claim=null;
      st.turn=st.mySeat;toast('The window closed — nobody challenged.');}
    chromeKey='';paint();
  },1000);
}
function botReply(){
  const st=S.g;if(!st)return;
  setTimeout(()=>{
    const p=st.players.filter(q=>q.bot)[0];if(!p)return;
    S.msgs.push({n:p.name,t:QUICK_CHAT[Math.floor(Math.random()*QUICK_CHAT.length)]});
    if(!S.chat)S.unread++;
    if(S.screen==='table'){chromeKey='';paint();
      if(S.chat){document.querySelectorAll('.side').forEach(n=>n.remove());
        document.getElementById('app').insertAdjacentHTML('beforeend',chatHTML());
        const b=document.getElementById('msgs');if(b)b.scrollTop=b.scrollHeight}}
  },900+Math.random()*900);
}

function applyTheme(){
  const r=document.documentElement;
  S.pal='a';r.dataset.pal='a';r.dataset.mode=S.mode;
  r.dataset.four=S.four?'1':'0';r.dataset.rtl=S.rtl?'1':'0';r.dataset.rm=S.rm?'1':'0';

}
let rT=null;
window.addEventListener('resize',()=>{
  S.vw=window.innerWidth;S.vh=window.innerHeight;
  clearTimeout(rT);rT=setTimeout(()=>{
    if(S.screen==='table'){chromeKey='';paint()}else render()},140);
});
window.addEventListener('orientationchange',()=>setTimeout(()=>{
  if(S.screen==='table'){chromeKey='';paint()}},320));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&S.screen==='table'&&S.g&&!S.g.over){stopClock()}
  else if(!document.hidden&&S.screen==='table'&&S.g&&!S.g.over){step()}
});
if(matchMedia('(prefers-reduced-motion: reduce)').matches)S.rm=true;

(function boot(){
  const known=load();
  applyTheme();
  Sfx.setOn(S.sound);
  S.screen=known?'home':'boot';
  if(known)S.tab='play';
  render();
})();


/* ══════════════════════════════════════════════════════════════════════════
   9 · THE BOARD
   Every screen at once. A frame is not a picture of a screen — it is a real
   360×640 screen, rendered by the same view functions the app runs, drawn at
   full size and then scaled down. So the type, the felt, the fan and the
   ganjifa backs in the atlas are the article itself; change a screen and its
   frame changes with it. The scale() on each frame also creates a containing
   block, which is what keeps the sheets, scrims and toasts — all fixed —
   inside their own frame instead of spilling across the board.
   ══════════════════════════════════════════════════════════════════════════ */
let atlasZ=.46,atlasGroup='All';
const ATLAS_GROUPS=['All','Start','Home','Rooms','Table','Results','Settings','Errors'];

/* every card object in a state, by id, so a still can draw what it finds */
function cardIndex(st){
  const m=new Map(),seen=new Set();
  (function walk(v){
    if(!v||typeof v!=='object'||seen.has(v))return;
    seen.add(v);
    if(typeof v.id==='string'&&v.r&&v.s){m.set(v.id,v);return}
    if(Array.isArray(v))v.forEach(walk);
    else Object.keys(v).forEach(k=>walk(v[k]));
  })(st);
  return m;
}
/* the same targets the live layer animates towards, written out as markup */
function stillCards(st,g){
  const {T}=computeTargets(st,g),look=cardIndex(st),w=Math.round(g.cw);
  return [...T].filter(([,t])=>!t.hidden)
    .sort((a,b)=>(a[1].zi||0)-(b[1].zi||0))
    .map(([id,t])=>{
      const c=look.get(id);if(!c)return '';
      const face=cardHTML(c,false,w)
        .replace('style="--w:',`style="box-shadow:${shadowFor(t.z||0)};--w:`);
      return `<div class="cst" style="transform:translate3d(${t.x.toFixed(1)}px,${
        t.y.toFixed(1)}px,${(t.z||0).toFixed(1)}px) rotate(${(t.rot||0).toFixed(2)}deg) rotateY(${
        t.faceUp?0:180}deg) rotateX(${t.rx||0}deg) scale(${(t.sc||1).toFixed(3)});z-index:${
        t.zi||1}">${face}</div>`;
    }).join('');
}
/* render any chrome screen without disturbing where the player actually is */
function shot(name,o){
  o=o||{};
  const pv={screen:S.screen,sheet:S.sheet,overlay:S.overlay,chat:S.chat,detail:S.detail};
  S.screen=name;S.sheet=o.sheet||null;S.overlay=o.overlay||null;S.chat=!!o.chat;
  if(o.detail)S.detail=o.detail;
  let html;
  try{
    html=(V[name]||V.home)()+(o.chat?chatHTML():'')+sheetHTML()+overlayHTML();
  }catch(err){
    html=`<div class="screen"><div class="scroll center"><p class="cap">${
      esc(name)} could not be drawn — ${esc(err.message)}</p></div></div>`;
  }
  Object.assign(S,pv);
  return html;
}
function tableShot(st,w,h,o){
  o=o||{};
  const pv={g:S.g,screen:S.screen,sheet:S.sheet,overlay:S.overlay,chat:S.chat,sel:S.sel};
  S.g=st;S.screen='table';S.sheet=o.sheet||null;S.overlay=o.overlay||null;
  S.chat=!!o.chat;S.sel=o.sel||[];
  let html;
  try{
    const g=geomFor(w,h-96);                    /* the scene, less both bars */
    let chrome=tableChrome(g)
      .replace('<div id="cards"></div>',
        `<div class="cardlayer" style="--cw:${Math.round(g.cw)}px">${stillCards(st,g)}</div>`)
      .replace('<div id="seats"></div>',`<div class="seatlayer">${seatsHTML(st,g)}</div>`)
      .replace(' id="scene"','');
    html=`<div class="screen">${chrome}</div>`
      +(o.chat?chatHTML():'')+sheetHTML()+overlayHTML();
  }catch(err){
    html=`<div class="screen"><div class="scroll center"><p class="cap">table — ${
      esc(err.message)}</p></div></div>`;
  }
  Object.assign(S,pv);
  return html;
}
/* a dealt hand to pose for the camera, a few cards in where that reads better */
function demo(gid,seats,moves){
  const st=newGame(gid,{seats:seats});
  st.phase='playing';
  for(let i=0;i<(moves||0);i++){
    const L=legalFor(st,st.turn);
    if(!L.length)break;
    try{playCard(st,L[Math.floor(L.length/2)].id)}catch(e){break}
    if(st.phase!=='playing')break;
  }
  return st;
}

V.atlas=()=>{

  add('Rooms','PIN','the keypad',shot('pin'),0,'pin');

  add('Rooms','Private room','a code you send on',shot('room'),0,'room');
  add('Rooms','Lobby','waiting for the seats to fill',shot('wait'),0,'wait');
  add('Rooms','Pass and play','one phone, hand to hand',shot('pass'),0,'pass');

    tableShot(A,360,640),0,'table@thulla@4');

    tableShot(demo('thulla',4,2),800,390),1,'table@thulla@4');
  add('Table','Thulla · 7 seats','opponents line the top edge',
    tableShot(demo('thulla',7,1),360,640),0,'table@thulla@7');
  add('Table','Callbreak','bids and tricks on every plate',
    tableShot(demo('callbreak',4,3),360,640),0,'table@callbreak@4');
  add('Table','Seep','the floor, houses and the capture chooser',
    tableShot(demo('seep',4,0),360,640),0,'table@seep@4');
  add('Table','Hazari','thirteen cards into 3 · 3 · 3 · 4',
    tableShot(demo('hazari',4,0),360,640),0,'table@hazari@4');
  add('Table','Badam Satti','the four rows building out from 7♥',
    tableShot(demo('badamsatti',6,4),360,640),0,'table@badamsatti@6');
  add('Table','Marriage','stock, discard and twenty-one in hand',
    tableShot(demo('marriage',2,0),360,640),0,'table@marriage@2');
  add('Table','House rules sheet','switches, mid-hand',
    tableShot(A,360,640,{sheet:'rules'}),0,'table@thulla@4');
  add('Table','Table menu','leave, rules, tracker, sound',
    tableShot(A,360,640,{sheet:'menu'}),0,'table@thulla@4');
  add('Table','Card tracker','what has already gone',
    tableShot(A,360,640,{sheet:'tracker'}),0,'table@thulla@4');
  add('Table','Chat and voice','quick phrases, typing, levels',
    tableShot(A,360,640,{chat:1}),0,'table@thulla@4');

  /* — endings — */
  const B=demo('callbreak',4,0);
  B.players.forEach((p,i)=>{p.bid=3;p.tricks=i===0?4:3});
  endHand(B);
  add('Results','Hand result','the ledger, and why each row scored',
    shotWith(B,'handresult'),0,'handresult');
  const C=demo('thulla',4,0);
  C.finished=[1,2,3];C.bhabhi=C.players[0];endHand(C);
  add('Results','Hand over','who was left holding the cards',
    shotWith(C,'endgame'),0,'endgame');
  add('Results','Match summary','the whole match, win or interrupted',shot('match'),0,'match');

  /* — you, and the settings tree — */
  add('Settings','You','level, badges, recent hands',shot('me'),0,'me');
  add('Settings','Table designs','nineteen regional cloths',shot('themes'),0,'themes');
  add('Settings','Settings','the whole tree from one panel',shot('settings'),0,'settings');
  add('Settings','How it looks','theme, palette, cards',shot('appearance'),0,'appearance');

  Object.keys(OV).forEach(k=>add('Errors',k==='leave'?'Leave this match?':OV[k][0],k,

  const shown=cells.filter(c=>atlasGroup==='All'||c.grp===atlasGroup);

    <div class="fnm">${esc(c.label)}<small>${esc(c.sub||'')}</small></div></div>`).join('');

  return `<div class="screen">
  <div class="head"><button class="back-b" data-a="nav:settings" aria-label="Back">‹</button>

      [[32,'S'],[46,'M'],[68,'L']].map(([z,l])=>
        `<button class="${Math.round(atlasZ*100)===z?'on':''}" data-a="atlasz:${z}"
          aria-label="Zoom ${l}">${l}</button>`).join('')}</div>
  </div>
  <div class="scroll"><div class="board" style="--z:${atlasZ};--fw:360px;--fh:640px">${board}</div>
    <p class="cap" style="text-align:center;margin-top:10px">Every frame is live markup at
      ${Math.round(atlasZ*100)}% — tap one to open it for real.</p>

};
/* handresult and endgame read S.g, so they get their own posed state */
function shotWith(st,name){
  const pv=S.g;S.g=st;
  const html=shot(name);
  S.g=pv;return html;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,i=a.indexOf(':');
  const k=i<0?a:a.slice(0,i),v=i<0?'':a.slice(i+1);
  if(k==='atlasz'){atlasZ=+v/100;render();return}
  if(k==='atlasg'){atlasGroup=v;render();return}
  if(k==='atlasopen'&&v){
    const [kind,gid,seats]=v.split('@');
    if(kind==='table'){S.room.game=gid;S.room.seats=+seats;startGame();return}
    if(kind==='detail'){S.detail='thulla';S.room.game='thulla'}
    if(V[kind])go(kind);
  }
});
if(location.hash==='#atlas'){S.screen='atlas';S.tab='settings'}
if(S.screen==='atlas')render();
