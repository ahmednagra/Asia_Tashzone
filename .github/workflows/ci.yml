name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tashzone
          POSTGRES_PASSWORD: tashzone-ci
          POSTGRES_DB: tashzone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tashzone -d tashzone"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend/api
    env:
      PG_URL: postgresql+psycopg://tashzone:tashzone-ci@localhost:5432/tashzone
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/api/uv.lock
      - run: uv sync --frozen
      - name: Migrate an empty PostgreSQL database
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ env.PG_URL }}
      - name: Tests on PostgreSQL
        run: uv run pytest -q
        env:
          TZ_TEST_DATABASE_URL: ${{ env.PG_URL }}
      - name: Tests on SQLite
        run: uv run pytest -q
